    // ─────────────────────────────────────────────────────────────
    // TEAM BOARD & BODY-DOUBLING
    // ─────────────────────────────────────────────────────────────
    function Team({
      tasks, energy, alexStatus, setAlexStatus, doublingActive, setDoublingActive,
      focusTime, setFocusTime, activeTask, setActiveTask, fmt, setScreen,
      sessionMembers, setSessionMembers, pendingInvites, setPendingInvites, onInviteTeammate,
      onOpenMicrosteps
    }) {
      const energyLabel = { niedrig: 'Niedrig', mittel: 'Mittel', hoch: 'Hoch' };
      const energyCounts = TEAM.reduce((acc, m) => { acc[m.energy] = (acc[m.energy] || 0) + 1; return acc; }, {});

      // Find the next important task (first undone today's task, sorted by energy match and priority)
      const sortedTodayTasks = [...tasks]
        .filter(t => !t.isIncoming && !t.done)
        .sort((a, b) => {
          const p = { hoch: 0, mittel: 1, niedrig: 2 };
          const ma = a.eng === energy ? 0 : 1;
          const mb = b.eng === energy ? 0 : 1;
          if (ma !== mb) return ma - mb;
          return p[a.priority] - p[b.priority];
        });
      const nextImportantTask = sortedTodayTasks[0];

      const handleStartSession = (task) => {
        setActiveTask(task);
        setFocusTime(0);
        setDoublingActive(true);
      };

      const handleStopSession = () => {
        setDoublingActive(false);
        setFocusTime(0);
        setSessionMembers([]);
        setPendingInvites([]);
        setScreen(SCREENS.DASHBOARD);
      };

      return (
        <div style={{
          padding: '24px',
          maxWidth: '760px',
          margin: '0 auto',
          animation: 'fadeIn 0.25s ease'
        }}>
          
          {/* Centerpiece (Body-Doubling) */}
          <div>
            {doublingActive ? (
              <>
                {/* Active Session Card */}
                <div style={{ background: '#EEEDFE', borderRadius: 'var(--border-radius-lg)', padding: '32px 28px', border: '0.5px solid #AFA9EC', textAlign: 'center', animation: 'fadeIn 0.3s ease', display: 'flex', flexDirection: 'column', gap: '20px' }}>
                  <div>
                    <p style={{ fontSize: '11px', color: '#534AB7', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 500 }}>Live Session</p>
                    <p style={{ fontSize: '64px', fontWeight: 400, color: '#3C3489', letterSpacing: '-2px', fontVariantNumeric: 'tabular-nums', lineHeight: 1, marginTop: '8px' }}>{fmt(focusTime)}</p>
                    <p style={{ fontSize: '11px', color: '#7F77DD', marginTop: '4px' }}>Fokus-Zeit (Ziel: 45 min)</p>
                  </div>

                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px', padding: '12px 18px', background: 'white', borderRadius: 'var(--border-radius-md)', border: '0.5px solid #AFA9EC80', maxWidth: '480px', margin: '0 auto', width: '100%' }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '10px', minWidth: 0, flex: 1 }}>
                      <i className="ti ti-target" style={{ fontSize: '16px', color: '#534AB7', flexShrink: 0 }} />
                      <p style={{ fontSize: '13px', color: '#3C3489', fontWeight: 500, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {activeTask ? activeTask.title : 'Fokusaufgabe'}
                      </p>
                    </div>
                    {activeTask && (
                      <button onClick={() => onOpenMicrosteps(activeTask)} style={{ padding: '4px 8px', background: '#EEEDFE', border: '0.5px solid #AFA9EC', borderRadius: 'var(--border-radius-sm)', color: '#534AB7', fontSize: '11px', fontWeight: 500, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '4px', transition: 'all 0.15s', flexShrink: 0 }} onMouseEnter={e => e.currentTarget.style.background = 'rgba(127,119,221,0.1)'} onMouseLeave={e => e.currentTarget.style.background = '#EEEDFE'} title="Microsteps öffnen">
                        <i className="ti ti-stairs-up" style={{ fontSize: '12px' }} /> Microsteps
                      </button>
                    )}
                  </div>

                  {/* Progress bar */}
                  <div style={{ maxWidth: '480px', margin: '0 auto', width: '100%' }}>
                    <div style={{ height: '5px', background: 'rgba(83,74,183,0.15)', borderRadius: '2.5px' }}>
                      <div style={{ height: '100%', background: '#7F77DD', borderRadius: '2.5px', width: `${Math.min(parseFloat(((focusTime / (45 * 60)) * 100).toFixed(1)), 100)}%`, transition: 'width 1s linear' }} />
                    </div>
                    <p style={{ fontSize: '10px', color: '#AFA9EC', marginTop: '6px', textAlign: 'right' }}>
                      {Math.min(Math.round((focusTime / (45 * 60)) * 100), 100)}% abgeschlossen
                    </p>
                  </div>

                  {/* Session members */}
                  <div style={{ borderTop: '0.5px solid #C0BCEC60', paddingTop: '18px', textAlign: 'left' }}>
                    <p style={{ fontSize: '11px', fontWeight: 500, color: '#534AB7', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '12px' }}>Gemeinsam im Fokus</p>
                    <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '12px' }}>
                      {/* Alex */}
                      <div style={{ background: 'white', borderRadius: 'var(--border-radius-md)', padding: '10px 12px', display: 'flex', alignItems: 'center', gap: '10px', border: '0.5px solid #AFA9EC' }}>
                        <div style={{ width: '30px', height: '30px', borderRadius: '8px', background: '#7F77DD', color: '#EEEDFE', fontSize: '12px', fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>A</div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <p style={{ fontSize: '12px', fontWeight: 500, color: '#3C3489' }}>Alex (Du)</p>
                          <p style={{ fontSize: '10px', color: '#7F77DD' }}>Fokus aktiv</p>
                        </div>
                        <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#1D9E75', animation: 'pulse 2s infinite' }} />
                      </div>
                      {/* Active team members doing doubling */}
                      {TEAM.filter(m => sessionMembers.includes(m.id)).map(m => (
                        <div key={m.id} style={{ background: 'white', borderRadius: 'var(--border-radius-md)', padding: '10px 12px', display: 'flex', alignItems: 'center', gap: '10px', border: '0.5px solid var(--color-border-tertiary)' }}>
                          <div style={{ width: '30px', height: '30px', borderRadius: '8px', background: m.bg, color: m.col, fontSize: '12px', fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{m.init}</div>
                          <div style={{ flex: 1, minWidth: 0 }}>
                            <p style={{ fontSize: '12px', fontWeight: 500, color: 'var(--color-text-primary)' }}>{m.name}</p>
                            <p style={{ fontSize: '10px', color: '#7F77DD' }}>Fokus aktiv</p>
                          </div>
                          <span style={{ width: '6px', height: '6px', borderRadius: '50%', background: '#1D9E75', animation: 'pulse 2s infinite' }} />
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Actions */}
                  <div style={{ display: 'flex', gap: '10px', justifyContent: 'center', marginTop: '10px' }}>
                    <button onClick={handleStopSession} style={{ padding: '12px 24px', background: '#D85A30', color: 'white', border: 'none', borderRadius: 'var(--border-radius-md)', fontSize: '13px', fontWeight: 500, cursor: 'pointer', transition: 'background 0.15s' }}>
                      Session beenden
                    </button>
                  </div>
                </div>

                {/* Kollegen dazuholen Card */}
                <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '20px 22px', border: '0.5px solid var(--color-border-secondary)', marginTop: '20px', textAlign: 'left', animation: 'fadeIn 0.35s ease' }}>
                  <p style={{ fontSize: '11px', fontWeight: 500, color: 'var(--color-text-secondary)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '14px' }}>
                    <i className="ti ti-plus" style={{ fontSize: '12px', marginRight: '5px', color: '#7F77DD' }} />Kollegen ins Body-Doubling einladen
                  </p>
                  <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '12px' }}>
                    {TEAM.map(m => (
                      <div key={m.id} style={{ background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-lg)', padding: '12px 14px', border: '0.5px solid var(--color-border-tertiary)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: '10px' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: '10px', minWidth: 0 }}>
                          <div style={{ width: '32px', height: '32px', borderRadius: '9px', background: m.bg, color: m.col, fontSize: '11px', fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, position: 'relative' }}>
                            {m.init}
                            <div style={{ position: 'absolute', bottom: '-2px', right: '-2px', width: '8px', height: '8px', borderRadius: '50%', background: '#5DCAA5', border: '1.5px solid var(--color-background-secondary)' }} />
                          </div>
                          <div style={{ minWidth: 0 }}>
                            <p style={{ fontSize: '12px', fontWeight: 500, color: 'var(--color-text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{m.name}</p>
                            <p style={{ fontSize: '10px', color: 'var(--color-text-tertiary)' }}>online</p>
                          </div>
                        </div>
                        {/* Invite states */}
                        {sessionMembers.includes(m.id) ? (
                          <span style={{ fontSize: '11px', color: '#1D9E75', fontWeight: 500, display: 'flex', alignItems: 'center', gap: '3px', marginRight: '4px' }}>
                            <i className="ti ti-circle-check" /> Aktiv
                          </span>
                        ) : pendingInvites.includes(m.id) ? (
                          <span style={{ fontSize: '11px', color: '#7F77DD', fontWeight: 500, animation: 'pulse 1.5s infinite', marginRight: '4px' }}>
                            Warte...
                          </span>
                        ) : (
                          <button onClick={() => onInviteTeammate(m.id)} style={{ padding: '6px 12px', background: '#EEEDFE', border: '0.5px solid #AFA9EC', borderRadius: 'var(--border-radius-md)', color: '#534AB7', fontSize: '10px', fontWeight: 500, cursor: 'pointer', transition: 'all 0.15s' }} onMouseEnter={e => e.currentTarget.style.background = 'rgba(127,119,221,0.1)'} onMouseLeave={e => e.currentTarget.style.background = '#EEEDFE'}>
                            Body-Doubling anfragen
                          </button>
                        )}
                      </div>
                    ))}
                  </div>
                </div>
              </>
            ) : (
              /* Inactive / Start Session Card */
              <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '24px', border: '0.5px solid var(--color-border-secondary)', display: 'flex', flexDirection: 'column', gap: '20px', animation: 'fadeIn 0.3s ease' }}>
                <div style={{ textAlign: 'center', padding: '20px 0 10px' }}>
                  <div style={{ width: '56px', height: '56px', borderRadius: '16px', background: '#EEEDFE', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 16px', border: '1px solid #7F77DD40' }}>
                    <i className="ti ti-users" style={{ fontSize: '26px', color: '#7F77DD' }} />
                  </div>
                  <h3 style={{ fontSize: '18px', fontWeight: 500, color: 'var(--color-text-primary)' }}>Möchtest du eine Body-Doubling Session starten?</h3>
                  <p style={{ fontSize: '13px', color: 'var(--color-text-secondary)', marginTop: '6px', maxWidth: '440px', margin: '6px auto 0', lineHeight: 1.5 }}>
                    Beim Body-Doubling arbeiten du und dein Team parallel im Fokusmodus. Du kannst die Session für deine wichtigste priorisierte Aufgabe starten.
                  </p>
                </div>

                <div style={{ borderTop: '0.5px solid var(--color-border-tertiary)', paddingTop: '18px' }}>
                  <p style={{ fontSize: '11px', fontWeight: 500, color: 'var(--color-text-secondary)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '12px' }}>Wichtigste priorisierte Aufgabe</p>
                  
                  {!nextImportantTask ? (
                    <div style={{ padding: '16px', background: 'var(--color-background-secondary)', borderRadius: 'var(--border-radius-md)', textAlign: 'center', color: 'var(--color-text-tertiary)', fontSize: '13px' }}>
                      Keine offenen Aufgaben für heute. Erstelle eine Aufgabe auf dem Dashboard!
                    </div>
                  ) : (
                    <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '12px 14px', background: 'var(--color-background-secondary)', border: '0.5px solid var(--color-border-tertiary)', borderRadius: 'var(--border-radius-md)' }}>
                      <div style={{ minWidth: 0, flex: 1, marginRight: '16px' }}>
                        <p style={{ fontSize: '13px', fontWeight: 500, color: 'var(--color-text-primary)', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{nextImportantTask.title}</p>
                        <p style={{ fontSize: '11px', color: 'var(--color-text-tertiary)', marginTop: '2px' }}>Priorität: {nextImportantTask.priority.toUpperCase()} · {nextImportantTask.deadline}</p>
                      </div>
                      <button onClick={() => handleStartSession(nextImportantTask)} style={{ padding: '8px 14px', background: '#7F77DD', color: 'white', border: 'none', borderRadius: 'var(--border-radius-md)', fontSize: '12px', fontWeight: 500, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '4px', transition: 'all 0.15s' }}>
                        Fokus starten <i className="ti ti-arrow-right" style={{ fontSize: '12px' }} />
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // MID-DAY ENERGY CHECK MODAL
    // ─────────────────────────────────────────────
    function MidDayEnergyCheck({ currentEnergy, onSelect }) {
      const energyLabel = { niedrig: 'Niedrig', mittel: 'Mittel', hoch: 'Hoch' };
      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(26,26,46,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200, backdropFilter: 'blur(4px)' }}>
          <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '28px 26px', width: '400px', maxWidth: '94vw', border: '0.5px solid var(--color-border-secondary)', animation: 'fadeIn 0.2s ease' }}>
            <div style={{ display: 'flex', justifyContent: 'center', marginBottom: '20px' }}>
              <Companion size="sm" mood="celebrating" wave={false} animate={false} />
            </div>
            <p style={{ fontSize: '15px', color: 'var(--color-text-primary)', lineHeight: 1.65, marginBottom: '22px', textAlign: 'center' }}>
              Du hast in 1,5 Stunden drei Aufgaben erledigt und eine Pause gemacht.{' '}
              <span style={{ fontWeight: 500 }}>Gute Arbeit.</span>
              <br />
              Heute morgen war deine Energie{' '}
              <span style={{ fontWeight: 500 }}>{energyLabel[currentEnergy] || currentEnergy}</span>.
              <br />
              Wie ist deine Energie jetzt?
            </p>
            <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
              {[
                { v: 'niedrig', l: 'Niedrig', icon: 'ti-battery-1', col: '#D85A30', bg: '#FAECE7', tc: '#993C1D' },
                { v: 'mittel',  l: 'Mittel',  icon: 'ti-battery-3', col: '#BA7517', bg: '#FAEEDA', tc: '#854F0B' },
                { v: 'hoch',    l: 'Hoch',    icon: 'ti-battery-4', col: '#0F6E56', bg: '#E1F5EE', tc: '#085041' },
              ].map(e => (
                <button key={e.v} onClick={() => onSelect(e.v)} style={{ padding: '12px 16px', borderRadius: 'var(--border-radius-md)', border: `0.5px solid ${e.col}50`, background: e.bg, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '13px', transition: 'all 0.15s' }}>
                  <i className={`ti ${e.icon}`} style={{ fontSize: '22px', color: e.col }} />
                  <span style={{ fontSize: '13px', color: e.tc, fontWeight: 500 }}>{e.l}</span>
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // APP ROOT
    // ─────────────────────────────────────────────
    function App() {
      const [screen, setScreen] = useState(SCREENS.MORNING);
      const [energy, setEnergy] = useState(null);
      const [mood, setMood] = useState(null);
      const [tasks, setTasks] = useState(TASKS);
      const [bp, setBp] = useState(0);
      const [alexStatus, setAlexStatus] = useState('fokus');
      const [focusTime, setFocusTime] = useState(0);
      const [activeTask, setActiveTask] = useState(null);
      const [doublingActive, setDoublingActive] = useState(false);
      const timerRef = useRef(null);
      const breathRef = useRef(null);

      const [sessionMembers, setSessionMembers] = useState([]);
      const [pendingInvites, setPendingInvites] = useState([]);

      const handleInviteTeammate = (id) => {
        setPendingInvites(prev => [...prev, id]);
        setTimeout(() => {
          setPendingInvites(prev => prev.filter(x => x !== id));
          setSessionMembers(prev => [...prev, id]);
        }, 2000);
      };

      useEffect(() => {
        if (screen === SCREENS.TEAM && !doublingActive) {
          const sortedTasksList = sorted();
          const nextImportant = sortedTasksList.find(t => !t.isIncoming && !t.done);
          setActiveTask(nextImportant || null);
          setFocusTime(0);
          setDoublingActive(true);
        }
      }, [screen, doublingActive]);

      useEffect(() => {
        if (screen === SCREENS.FREEZE) {
          breathRef.current = setInterval(() => setBp(p => (p + 1) % 4), 4000);
          return () => clearInterval(breathRef.current);
        }
      }, [screen]);

      useEffect(() => {
        if (screen === SCREENS.TEAM && doublingActive) {
          timerRef.current = setInterval(() => setFocusTime(t => t + 1), 1000);
        } else {
          clearInterval(timerRef.current);
        }
        return () => clearInterval(timerRef.current);
      }, [screen, doublingActive]);

      const [microstepProgress, setMicrostepProgress] = useState({});
      const [selectedMicroTask, setSelectedMicroTask] = useState(null);
      const [freezeCount, setFreezeCount] = useState(0);
      const [invisibleWork, setInvisibleWork] = useState([]);
      const [goodMoments, setGoodMoments] = useState([]);
      const [thankYouToast, setThankYouToast] = useState(null);
      const [simulated, setSimulated] = useState(false);
      const [showMidDayCheck, setShowMidDayCheck] = useState(false);
      const [midDayCheckShown, setMidDayCheckShown] = useState(false);
      const [midDayConfirm, setMidDayConfirm] = useState(false);

      const [isTodayTasksExpanded, setIsTodayTasksExpanded] = useState(false);
      const [isIncomingTasksExpanded, setIsIncomingTasksExpanded] = useState(false);
      const [incomingFilter, setIncomingFilter] = useState('all');

      const addInvisibleWork = (emoji, text) => {
        const now = new Date();
        const time = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        setInvisibleWork(w => [...w, { emoji, text, time }]);
      };

      const addGoodMoment = (emoji, text, cat) => {
        setGoodMoments(m => [...m, { id: Date.now(), emoji, text, cat, date: 'Heute' }]);
      };

      const addTask = (title) => {
        if (!title.trim()) return;
        const newTask = {
          id: Date.now(),
          title: title,
          priority: 'mittel',
          deadline: 'Heute',
          eng: energy || 'mittel',
          done: false,
          isIncoming: false,
          source: 'eigene',
          dependsOn: null
        };
        setTasks(ts => [...ts, newTask]);
        addInvisibleWork('📝', `Hinzugefügt: ${title.slice(0, 24)}…`);
      };

      const handleMidDayEnergySelect = (newEnergy) => {
        setEnergy(newEnergy);
        setShowMidDayCheck(false);
        setMidDayCheckShown(true);
        setMidDayConfirm(true);
        setTimeout(() => setMidDayConfirm(false), 5000);
      };

      const triggerThankYou = (task) => {
        if (!task.dependsOn) return;
        const member = TEAM.find(m => m.id === task.dependsOn.id);
        const message = THANK_YOU_MSGS[task.dependsOn.id];
        if (member && message) {
          setTimeout(() => setThankYouToast({ member, message }), 900);
        }
      };

      const handleSimulate = () => {
        setTasks(FRIDAY_TASKS);
        setSimulated(true);
        setMicrostepProgress({});
        setInvisibleWork([]);
      };

      const completeMicrostep = (taskId, newCount) => {
        setMicrostepProgress(p => ({ ...p, [taskId]: newCount }));
        const task = tasks.find(t => t.id === taskId);
        addInvisibleWork('🪜', `Schritt ${newCount}/5: ${task?.title?.slice(0, 28)}…`);
        if (newCount === 5) {
          setTasks(ts => ts.map(t => t.id === taskId ? { ...t, done: true } : t));
          addGoodMoment('✅', `${task?.title} vollständig abgeschlossen`, 'Aufgabe');
          addInvisibleWork('🎯', `Aufgabe komplett: ${task?.title?.slice(0, 28)}`);
          if (task) triggerThankYou(task);
          const newDoneCount = tasks.filter(t => t.done).length + 1;
          if (newDoneCount === 3 && !midDayCheckShown) {
            setTimeout(() => setShowMidDayCheck(true), 800);
          }
          if (activeTask && activeTask.id === taskId) {
            const remainingUndoneTasks = tasks
              .filter(t => t.id !== taskId)
              .filter(t => !t.isIncoming && !t.done)
              .sort((a, b) => {
                const p = { hoch: 0, mittel: 1, niedrig: 2 };
                const ma = a.eng === energy ? 0 : 1;
                const mb = b.eng === energy ? 0 : 1;
                if (ma !== mb) return ma - mb;
                return p[a.priority] - p[b.priority];
              });
            const nextImportant = remainingUndoneTasks[0] || null;
            setActiveTask(nextImportant);
          }
        }
      };

      const sorted = () => {
        const p = { hoch: 0, mittel: 1, niedrig: 2 };
        return [...tasks].sort((a, b) => {
          const ma = a.eng === energy ? 0 : 1;
          const mb = b.eng === energy ? 0 : 1;
          if (ma !== mb) return ma - mb;
          return p[a.priority] - p[b.priority];
        });
      };

      const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
      const toggle = id => {
        const task = tasks.find(t => t.id === id);
        const willDone = !task?.done;
        setTasks(ts => ts.map(t => t.id === id ? { ...t, done: !t.done } : t));
        if (willDone && task) {
          addInvisibleWork('✅', `Abgehakt: ${task.title.slice(0, 32)}`);
          addGoodMoment('✅', `${task.title} abgeschlossen`, 'Aufgabe');
          triggerThankYou(task);
          const newDoneCount = tasks.filter(t => t.done).length + 1;
          if (newDoneCount === 3 && !midDayCheckShown) {
            setTimeout(() => setShowMidDayCheck(true), 600);
          }
          if (activeTask && activeTask.id === id) {
            const remainingUndoneTasks = tasks
              .filter(t => t.id !== id)
              .filter(t => !t.isIncoming && !t.done)
              .sort((a, b) => {
                const p = { hoch: 0, mittel: 1, niedrig: 2 };
                const ma = a.eng === energy ? 0 : 1;
                const mb = b.eng === energy ? 0 : 1;
                if (ma !== mb) return ma - mb;
                return p[a.priority] - p[b.priority];
              });
            const nextImportant = remainingUndoneTasks[0] || null;
            setActiveTask(nextImportant);
          }
        }
      };
      const isExpanded = bp === 0 || bp === 1;
      const bLabels = ['Einatmen', 'Halten', 'Ausatmen', 'Halten'];

      const energyStyle = {
        niedrig: { bg: '#FAECE7', tx: '#993C1D', dot: '#D85A30', icon: 'ti-battery-1' },
        mittel: { bg: '#FAEEDA', tx: '#854F0B', dot: '#BA7517', icon: 'ti-battery-3' },
        hoch: { bg: '#E1F5EE', tx: '#085041', dot: '#0F6E56', icon: 'ti-battery-4' },
      };

      // Freeze & Hyperfocus are full-screen, no sidebar/header
      if (screen === SCREENS.FREEZE) {
        return <FreezeScreen bp={bp} isExpanded={isExpanded} bLabels={bLabels} setScreen={setScreen} freezeCount={freezeCount} />;
      }
      if (screen === SCREENS.HYPERFOCUS) {
        return <HyperfocusScreen tasks={tasks} setScreen={setScreen} />;
      }

      return (
        <div style={{ display: 'flex', height: '100vh', overflow: 'hidden' }}>
          <Sidebar screen={screen} setScreen={setScreen} onFreezeClick={() => { setFreezeCount(c => c + 1); setScreen(SCREENS.FREEZE); }} onHyperfocusClick={() => setScreen(SCREENS.HYPERFOCUS)} />
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
            <Header screen={screen} energy={energy} energyStyle={energyStyle} simulated={simulated} doublingActive={doublingActive} />
            <div style={{ flex: 1, overflowY: 'auto', background: 'var(--color-background-tertiary)' }}>
              <div key={screen} style={{ animation: 'fadeIn 0.25s ease', minHeight: '100%' }}>
                {screen === SCREENS.MORNING && <Morning mood={mood} setMood={setMood} energy={energy} setEnergy={setEnergy} setScreen={setScreen} />}
                {screen === SCREENS.DASHBOARD && <Dashboard sorted={sorted} tasks={tasks} toggle={toggle} energy={energy} energyStyle={energyStyle} setScreen={setScreen} setActiveTask={setActiveTask} microstepProgress={microstepProgress} onOpenMicrosteps={setSelectedMicroTask} invisibleWork={invisibleWork} simulated={simulated} onSimulate={handleSimulate} isTodayTasksExpanded={isTodayTasksExpanded} setIsTodayTasksExpanded={setIsTodayTasksExpanded} isIncomingTasksExpanded={isIncomingTasksExpanded} setIsIncomingTasksExpanded={setIsIncomingTasksExpanded} incomingFilter={incomingFilter} setIncomingFilter={setIncomingFilter} onAddTask={addTask} onStartDoubling={(task) => { setActiveTask(task); setFocusTime(0); setDoublingActive(true); setScreen(SCREENS.TEAM); }} />}
                {screen === SCREENS.TEAM && <Team tasks={tasks} energy={energy} alexStatus={alexStatus} setAlexStatus={setAlexStatus} doublingActive={doublingActive} setDoublingActive={setDoublingActive} focusTime={focusTime} setFocusTime={setFocusTime} activeTask={activeTask} setActiveTask={setActiveTask} fmt={fmt} setScreen={setScreen} sessionMembers={sessionMembers} setSessionMembers={setSessionMembers} pendingInvites={pendingInvites} setPendingInvites={setPendingInvites} onInviteTeammate={handleInviteTeammate} onOpenMicrosteps={setSelectedMicroTask} />}
                {screen === SCREENS.REFLECTION && <ReflectionScreen goodMoments={goodMoments} setScreen={setScreen} tasks={tasks} energy={energy} />}
              </div>
            </div>
          </div>
          {selectedMicroTask && (
            <MicrostepModal
              task={selectedMicroTask}
              completed={microstepProgress[selectedMicroTask.id] || 0}
              onComplete={completeMicrostep}
              onClose={() => setSelectedMicroTask(null)}
            />
          )}
          {showMidDayCheck && (
            <MidDayEnergyCheck
              currentEnergy={energy}
              onSelect={handleMidDayEnergySelect}
            />
          )}
          {midDayConfirm && (
            <div style={{
              position: 'fixed', bottom: '28px', left: '50%', transform: 'translateX(-50%)',
              zIndex: 300,
              background: '#EEEDFE',
              border: '0.5px solid #AFA9EC',
              borderRadius: 'var(--border-radius-lg)',
              boxShadow: '0 8px 32px rgba(26,26,46,0.14)',
              padding: '14px 20px',
              display: 'flex', alignItems: 'center', gap: '11px',
              animation: 'fadeIn 0.3s ease',
              whiteSpace: 'nowrap',
            }}>
              <i className="ti ti-check" style={{ fontSize: '16px', color: '#534AB7', flexShrink: 0 }} />
              <p style={{ fontSize: '13px', color: '#3C3489', fontWeight: 400 }}>
                Alles klar, ich habe die restlichen Aufgaben entsprechend deines Energie Updates priorisiert.
              </p>
            </div>
          )}
          <ThankYouToast toast={thankYouToast} onDismiss={() => setThankYouToast(null)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
