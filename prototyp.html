<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADHS Companion – Desktop</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --color-text-primary: #1A1A2E;
      --color-text-secondary: #5C5C7A;
      --color-text-tertiary: #9494B0;
      --color-background-primary: #FFFFFF;
      --color-background-secondary: #F7F6FE;
      --color-background-tertiary: #EEEDFE;
      --color-border-primary: #C0BCEC;
      --color-border-secondary: #DDD9F7;
      --color-border-tertiary: #E8E6FB;
      --border-radius-sm: 6px;
      --border-radius-md: 10px;
      --border-radius-lg: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body,
    #root {
      height: 100%;
    }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--color-background-tertiary);
      color: var(--color-text-primary);
      -webkit-font-smoothing: antialiased;
    }

    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--color-border-secondary);
      border-radius: 2px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.4;
      }
    }

    .task-row:hover {
      background: var(--color-background-secondary) !important;
    }

    .team-widget:hover {
      background: var(--color-background-secondary) !important;
    }

    .freeze-option:hover {
      background: rgba(255, 255, 255, 0.1) !important;
    }

    @keyframes popIn {
      from {
        opacity: 0;
        transform: scale(0.4) translateY(20px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes wave {

      0%,
      100% {
        transform: rotate(0deg);
      }

      25% {
        transform: rotate(-40deg);
      }

      75% {
        transform: rotate(8deg);
      }
    }

    @keyframes blink {

      0%,
      88%,
      100% {
        transform: scaleY(1);
      }

      93% {
        transform: scaleY(0.1);
      }
    }

    @keyframes floatBob {

      0%,
      100% {
        transform: translateY(0px);
      }

      50% {
        transform: translateY(-6px);
      }
    }

    @keyframes droop {

      0%,
      100% {
        transform: rotate(0deg) translateY(0px);
      }

      40% {
        transform: rotate(-2deg) translateY(2px);
      }

      70% {
        transform: rotate(1deg) translateY(1px);
      }
    }
  </style>
</head>

    // ─────────────────────────────────────────────
    // MICROSTEP MODAL
    // ─────────────────────────────────────────────
    function MicrostepModal({ task, completed, onComplete, onClose }) {
      const steps = MICROSTEPS[task.id] || [
        'Aufgabe analysieren',
        'Vorbereitungen treffen',
        'Hauptteil bearbeiten',
        'Details verfeinern',
        'Abschließen & prüfen'
      ];
      const [localCompleted, setLocalCompleted] = useState(completed);
      const [praise, setPraise] = useState(null);
      const [showTeam, setShowTeam] = useState(false);

      const doStep = (i) => {
        if (i !== localCompleted) return;
        const next = i + 1;
        setLocalCompleted(next);
        setPraise(PRAISES[i]);
        setShowTeam(true);
        onComplete(task.id, next);
        setTimeout(() => setShowTeam(false), 3200);
        setTimeout(() => setPraise(null), 3500);
      };

      // Staircase geometry
      const SW = 60, SH = 30, count = 5;
      const containerW = SW * count; // 300
      const containerH = SH * count + 60; // extra room for companion on top step

      const getPos = (c) => {
        if (c === 0) return { left: -18, bottom: SH + 2 };
        const idx = c - 1;
        return { left: SW * idx + SW / 2 - 18, bottom: SH * c + 2 };
      };
      const pos = getPos(localCompleted);

      return (
        <div style={{ position: 'fixed', inset: 0, background: 'rgba(26,26,46,0.55)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 200, backdropFilter: 'blur(4px)' }}

          <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '26px 24px', width: '440px', maxWidth: '94vw', border: '0.5px solid var(--color-border-secondary)', animation: 'fadeIn 0.2s ease', position: 'relative', overflow: 'hidden' }}>

            {showTeam && (

                <i className="ti ti-users" style={{ fontSize: '12px', marginRight: '5px' }} />Team benachrichtigt ✓
              </div>
            )}

            {/* Header */}
            <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '20px' }}>
              <div>
                <p style={{ fontSize: '10px', color: 'var(--color-text-tertiary)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '3px' }}>Microsteps · {localCompleted}/{count}</p>
                <h3 style={{ fontSize: '15px', fontWeight: 500, color: 'var(--color-text-primary)', lineHeight: 1.3, maxWidth: '280px' }}>{task.title}</h3>
              </div>
              <button onClick={onClose} style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--color-text-tertiary)', padding: '2px', flexShrink: 0 }}>
                <i className="ti ti-x" style={{ fontSize: '18px' }} />
              </button>
            </div>

            {/* Staircase */}
            <div style={{ position: 'relative', width: `${containerW}px`, height: `${containerH}px`, margin: '0 auto 24px' }}>
              {steps.map((_, i) => (
                <div key={i} style={{
                  position: 'absolute', left: `${SW * i}px`, bottom: 0,
                  width: `${SW}px`, height: `${SH * (i + 1)}px`,
                  background: i < localCompleted ? '#7F77DD' : 'var(--color-border-tertiary)',
                  transition: 'background 0.4s ease',
                  borderRadius: i === count - 1 ? '6px 6px 0 0' : '0',
                }}>
                  {i >= localCompleted && (
                    <span style={{ position: 'absolute', top: '4px', left: '50%', transform: 'translateX(-50%)', fontSize: '10px', color: 'var(--color-text-tertiary)', fontWeight: 500 }}>{i + 1}</span>
                  )}
                  {i < localCompleted && (
                    <i className="ti ti-check" style={{ position: 'absolute', top: '6px', left: '50%', transform: 'translateX(-50%)', fontSize: '11px', color: '#EEEDFE' }} />
                  )}
                </div>
              ))}

              {/* Mini companion */}
              <div style={{
                position: 'absolute',
                left: `${pos.left}px`,
                bottom: `${pos.bottom}px`,
                transition: 'left 0.5s cubic-bezier(0.34,1.56,0.64,1), bottom 0.4s cubic-bezier(0.34,1.56,0.64,1)',
                animation: 'floatBob 3s ease-in-out infinite',
                zIndex: 5,
              }}>
                {/* head */}
                <div style={{ width: '36px', height: '36px', borderRadius: '50%', background: '#EEEDFE', border: '2px solid #AFA9EC', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center' }}>

                    {[0, 1].map(i => <div key={i} style={{ width: '5px', height: '5px', borderRadius: '50%', background: '#3C3489', animation: 'blink 3.5s ease-in-out infinite' }} />)}
                  </div>
                  <div style={{ width: localCompleted > 0 ? '14px' : '12px', height: localCompleted > 0 ? '7px' : '5px', borderBottom: '2px solid #3C3489', borderRadius: '0 0 8px 8px', transition: 'all 0.3s' }} />
                </div>
                {/* body */}
                <div style={{ width: '26px', height: '16px', background: '#7F77DD', borderRadius: '8px 8px 10px 10px', margin: '2px auto 0', position: 'relative', left: '5px' }}>

                </div>
              </div>
            </div>

            {/* Steps list */}
            <div style={{ display: 'flex', flexDirection: 'column', gap: '7px', marginBottom: '14px' }}>
              {steps.map((step, i) => (
                <button key={i} onClick={() => doStep(i)} style={{
                  display: 'flex', alignItems: 'center', gap: '11px',
                  padding: '11px 13px',
                  background: i < localCompleted ? '#E1F5EE' : i === localCompleted ? '#EEEDFE' : 'var(--color-background-secondary)',
                  border: `0.5px solid ${i < localCompleted ? '#5DCAA580' : i === localCompleted ? '#AFA9EC' : 'var(--color-border-tertiary)'}`,
                  borderRadius: 'var(--border-radius-md)',
                  cursor: i === localCompleted ? 'pointer' : 'default',
                  textAlign: 'left', opacity: i > localCompleted ? 0.45 : 1,
                  transition: 'all 0.15s',
                }}>
                  <div style={{ width: '21px', height: '21px', borderRadius: '50%', flexShrink: 0, background: i < localCompleted ? '#1D9E75' : i === localCompleted ? '#7F77DD' : 'transparent', border: `1.5px solid ${i < localCompleted ? '#1D9E75' : i === localCompleted ? '#7F77DD' : 'var(--color-border-secondary)'}`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    {i < localCompleted ? <i className="ti ti-check" style={{ fontSize: '11px', color: 'white' }} /> : <span style={{ fontSize: '10px', fontWeight: 500, color: i === localCompleted ? 'white' : 'var(--color-text-tertiary)' }}>{i + 1}</span>}
                  </div>
                  <span style={{ fontSize: '13px', color: i < localCompleted ? '#085041' : i === localCompleted ? '#3C3489' : 'var(--color-text-secondary)', fontWeight: i === localCompleted ? 500 : 400, textDecoration: i < localCompleted ? 'line-through' : 'none', flex: 1 }}>{step}</span>
                  {i === localCompleted && <i className="ti ti-arrow-right" style={{ fontSize: '13px', color: '#7F77DD' }} />}
                </button>
              ))}
            </div>

            {/* Praise */}
            {praise && (
              <div style={{ background: '#EEEDFE', borderRadius: 'var(--border-radius-md)', padding: '11px 14px', border: '0.5px solid #AFA9EC', animation: 'fadeIn 0.2s ease', textAlign: 'center' }}>
                <p style={{ fontSize: '14px', fontWeight: 500, color: '#3C3489', marginBottom: '2px' }}>{praise[0]}</p>
                <p style={{ fontSize: '12px', color: '#534AB7' }}>{praise[1]}</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // SIDEBAR
    // ─────────────────────────────────────────────
    function Sidebar({ screen, setScreen, onFreezeClick, onHyperfocusClick }) {
      const navItems = [

        { icon: 'ti-notebook', label: 'Reflexion', s: SCREENS.REFLECTION, desc: 'Wochenrückblick' },
      ];
      const active = s => screen === s;

      return (
        <div style={{ width: '220px', background: 'var(--color-background-primary)', borderRight: '0.5px solid var(--color-border-secondary)', display: 'flex', flexDirection: 'column', flexShrink: 0, padding: '0 12px 16px' }}>

          {/* Logo */}

                  <p style={{ fontSize: '10px', color: active(item.s) ? '#7F77DD' : 'var(--color-text-tertiary)' }}>{item.desc}</p>

            {/* Impulse */}
            <div style={{ marginTop: '14px', display: 'flex', flexDirection: 'column', gap: '8px' }}>

              {/* Freeze-Modus */}
              <button onClick={onFreezeClick} style={{ width: '100%', padding: '9px 10px', borderRadius: 'var(--border-radius-md)', background: '#E6F1FB', border: '0.5px solid #C5DFF8', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '10px', textAlign: 'left', transition: 'all 0.15s' }}>
                <i className="ti ti-snowflake" style={{ fontSize: '16px', color: '#1D6BB7', flexShrink: 0 }} />
                <div>
                  <p style={{ fontSize: '13px', fontWeight: 500, color: '#1D6BB7', lineHeight: 1.3 }}>Freeze-Modus</p>
                  <p style={{ fontSize: '10px', color: '#4F8ED3' }}>Achtsamkeit</p>
                </div>
              </button>

              {/* Hyperfokus-Blocker */}
              <button onClick={onHyperfocusClick} style={{ width: '100%', padding: '9px 10px', borderRadius: 'var(--border-radius-md)', background: '#FAEEDA', border: '0.5px solid #F0C880', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '10px', textAlign: 'left', transition: 'all 0.15s' }}>
                <i className="ti ti-hand-stop" style={{ fontSize: '16px', color: '#854F0B', flexShrink: 0 }} />

                  <p style={{ fontSize: '13px', fontWeight: 500, color: '#854F0B', lineHeight: 1.3 }}>Hyperfokus-Blocker</p>
                  <p style={{ fontSize: '10px', color: '#BA7517' }}>Kontrollierte Pause</p>

              </button>
            </div>
          </div>

          {/* User */}
          <div style={{ paddingTop: '12px', borderTop: '0.5px solid var(--color-border-tertiary)' }}>

    // ─────────────────────────────────────────────

    function Header({ screen, energy, energyStyle, simulated, doublingActive }) {
      const dateLabel = simulated ? 'Freitag, 05. Juni' : 'Mittwoch, 03. Juni';
      const titles = {
        [SCREENS.MORNING]: { title: 'Morgen-Check', sub: dateLabel },
        [SCREENS.DASHBOARD]: { title: 'Mein Fokus', sub: dateLabel },
        [SCREENS.TEAM]: { title: 'Fokus', sub: doublingActive ? 'Body-Doubling Session läuft' : 'Live-Status' },
        [SCREENS.REFLECTION]: { title: 'Reflexion', sub: 'Dein Wochenrückblick' },

      return (
        <div style={{ height: '56px', padding: '0 24px', background: 'var(--color-background-primary)', borderBottom: '0.5px solid var(--color-border-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', flexShrink: 0 }}>

            <h1 style={{ fontSize: '16px', fontWeight: 500, color: 'var(--color-text-primary)', lineHeight: 1.2 }}>{t.title}</h1>

              <div style={{ display: 'flex', alignItems: 'center', gap: '5px', padding: '5px 10px', borderRadius: 'var(--border-radius-md)', background: energyStyle[energy].bg, border: `0.5px solid ${energyStyle[energy].dot}40` }}>
                <i className={`ti ${energyStyle[energy].icon}`} style={{ fontSize: '14px', color: energyStyle[energy].dot }} />

          </div>

    }

    // ─────────────────────────────────────────────
    // MORNING CHECK
    // ─────────────────────────────────────────────

    function Companion({ size = 'md', message = null, mood = 'happy', wave = true, animate = true }) {
      const sc = { sm: 0.55, md: 1, lg: 1.35 }[size] ?? 1;
      const px = v => `${Math.round(v * sc)}px`;

      const mouths = {
        happy: { width: px(24), height: px(12), borderBottom: `2.5px solid #3C3489`, borderRadius: `0 0 ${px(14)} ${px(14)}` },
        focused: { width: px(22), height: px(2), borderBottom: `2.5px solid #3C3489`, borderRadius: '0' },
        worried: { width: px(20), height: px(10), borderTop: `2.5px solid #3C3489`, borderRadius: `${px(14)} ${px(14)} 0 0` },
        celebrating: { width: px(28), height: px(14), borderBottom: `3px solid #3C3489`, borderRadius: `0 0 ${px(16)} ${px(16)}` },
      };
      const mouth = mouths[mood] ?? mouths.happy;
      const eyeScaleY = mood === 'focused' ? 0.6 : 1;

      return (
        <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: px(16) }}>

          {/* ── Figur ── */}
          <div style={{
            position: 'relative', width: px(120), height: px(170), flexShrink: 0,
            animation: animate
              ? 'popIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both, floatBob 3s ease-in-out 0.5s infinite'
              : 'floatBob 3s ease-in-out infinite',
          }}>

            {/* Linker Arm (winkt) */}
            <div style={{
              position: 'absolute', left: px(4), top: px(76),
              width: px(30), height: px(12),
              background: '#7F77DD', borderRadius: px(6),
              transformOrigin: 'right center',
              animation: wave ? 'wave 1s ease-in-out 0.6s infinite' : 'none',
            }} />

            {/* Rechter Arm (ruhig) */}
            <div style={{
              position: 'absolute', right: px(4), top: px(80),
              width: px(24), height: px(12),
              background: '#7F77DD', borderRadius: px(6),
            }} />

            {/* Körper */}
            <div style={{
              position: 'absolute', left: '50%', transform: 'translateX(-50%)',
              top: px(72), width: px(54), height: px(72),
              background: '#7F77DD',
              borderRadius: `${px(16)} ${px(16)} ${px(22)} ${px(22)}`,
            }} />

            {/* Herz */}
            <div style={{
              position: 'absolute', left: '50%', top: px(88),
              transform: 'translateX(-50%)',
              fontSize: px(12), color: '#EEEDFE', lineHeight: 1,
            }}>♥</div>

            {/* Kopf */}
            <div style={{
              position: 'absolute', left: '50%', transform: 'translateX(-50%)',
              top: 0, width: px(66), height: px(66),
              background: '#EEEDFE', borderRadius: '50%',
              border: `2.5px solid #AFA9EC`,
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexDirection: 'column',
            }}>
              {mood === 'celebrating' && (
                <div style={{ position: 'absolute', top: px(-18), fontSize: px(14) }}>✨</div>
              )}
              <div style={{ display: 'flex', gap: px(12), marginBottom: px(6), marginTop: px(6) }}>
                {[0, 1].map(i => (
                  <div key={i} style={{
                    width: px(9), height: px(9), borderRadius: '50%',
                    background: '#3C3489',
                    transform: `scaleY(${eyeScaleY})`,
                    animation: 'blink 3.5s ease-in-out 1s infinite',
                    transformOrigin: 'center',
                  }} />
                ))}
              </div>
              <div style={mouth} />
            </div>

            {/* Füße */}
            <div style={{
              position: 'absolute', bottom: 0, left: '50%', transform: 'translateX(-50%)',
              display: 'flex', gap: px(8),
            }}>
              {[0, 1].map(i => (
                <div key={i} style={{
                  width: px(18), height: px(14),
                  background: '#534AB7',
                  borderRadius: `${px(6)} ${px(6)} ${px(8)} ${px(8)}`,
                }} />
              ))}
            </div>
          </div>

          {/* ── Sprechblase ── */}
          {message && (
            <div style={{
              background: 'var(--color-background-primary)',
              borderRadius: 'var(--border-radius-lg)',
              padding: `${px(16)} ${px(22)}`,
              border: '0.5px solid var(--color-border-secondary)',
              maxWidth: px(280), textAlign: 'center',
              position: 'relative',
              animation: 'fadeIn 0.4s ease 0.3s both',
            }}>
              <div style={{
                position: 'absolute', top: '-9px', left: '50%', transform: 'translateX(-50%)',
                width: 0, height: 0,
                borderLeft: '9px solid transparent', borderRight: '9px solid transparent',
                borderBottom: '9px solid var(--color-border-secondary)',
              }} />
              <div style={{
                position: 'absolute', top: '-7px', left: '50%', transform: 'translateX(-50%)',
                width: 0, height: 0,
                borderLeft: '8px solid transparent', borderRight: '8px solid transparent',
                borderBottom: '8px solid var(--color-background-primary)', zIndex: 1,
              }} />
              <p style={{ fontSize: px(13), color: 'var(--color-text-secondary)', lineHeight: 1.6 }}>{message}</p>
            </div>
          )}
        </div>
      );
    }

    function Morning({ mood, setMood, energy, setEnergy, setScreen }) {
      const [showIntro, setShowIntro] = useState(true);
      const [showPersonalized, setShowPersonalized] = useState(false);

      useEffect(() => {
        const t = setTimeout(() => setShowIntro(false), 3500);
        return () => clearTimeout(t);
      }, []);

      const handleStart = () => {
        if (!energy || !mood) return;
        setShowPersonalized(true);
        setTimeout(() => {
          setShowPersonalized(false);
          setScreen(SCREENS.DASHBOARD);
        }, 3200);
      };

      const personalMsg = MORNING_MSGS[`${mood}_${energy}`] || 'Schön, dass du da bist. Ich bin heute an deiner Seite.';

      if (showIntro) {
        return (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100%', padding: '40px 24px' }}>
            <div style={{ textAlign: 'center', animation: 'fadeIn 0.4s ease' }}>
              <Companion
                size="lg"
                mood="happy"
                wave={true}
                animate={true}
                message="Hey Alex! Schön, dass du da bist. Ich bin heute an deiner Seite."
              />
              <button
                onClick={() => setShowIntro(false)}
                style={{
                  marginTop: '20px', padding: '10px 22px',
                  background: 'transparent',
                  border: '0.5px solid var(--color-border-secondary)',
                  borderRadius: 'var(--border-radius-md)',
                  fontSize: '12px', color: 'var(--color-text-tertiary)',
                  cursor: 'pointer', animation: 'fadeIn 0.3s ease 1s both',
                }}
