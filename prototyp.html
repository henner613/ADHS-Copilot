                {"Los geht's →"}
              </button>
            </div>
          </div>
        );
      }

      if (showPersonalized) {
        const companionMood = energy === 'hoch' ? 'celebrating' : mood === 'gestresst' ? 'worried' : 'happy';
        return (
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100%', padding: '40px 24px' }}>
            <div style={{ textAlign: 'center', animation: 'fadeIn 0.3s ease' }}>
              <Companion size="lg" mood={companionMood} wave={energy === 'hoch'} animate={true} message={personalMsg} />
              <p style={{ marginTop: '24px', fontSize: '12px', color: 'var(--color-text-tertiary)', animation: 'fadeIn 0.3s ease 1.5s both' }}>
                Dashboard wird geladen…
              </p>
            </div>
          </div>
        );
      }

      return (
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100%', padding: '40px 24px' }}>
          <div style={{ width: '100%', maxWidth: '540px', animation: 'fadeIn 0.3s ease' }}>
            <div style={{ marginBottom: '36px' }}>
              <p style={{ fontSize: '12px', color: 'var(--color-text-tertiary)', textTransform: 'uppercase', letterSpacing: '0.06em', fontWeight: 500, marginBottom: '8px' }}>Mittwoch, 03. Juni</p>
              <h2 style={{ fontSize: '34px', fontWeight: 400, color: 'var(--color-text-primary)', lineHeight: 1.2, marginBottom: '10px' }}>
                Guten Morgen, <span style={{ color: '#534AB7' }}>Alex</span>
              </h2>
              <p style={{ fontSize: '15px', color: 'var(--color-text-secondary)', lineHeight: 1.6 }}>Kurzer Einchecken – dauert 30 Sekunden.</p>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '16px', marginBottom: '16px' }}>
              <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '20px', border: '0.5px solid var(--color-border-secondary)' }}>
                <p style={{ fontSize: '11px', fontWeight: 500, color: 'var(--color-text-secondary)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '14px' }}>{"Wie geht's dir gerade?"}</p>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
                  {[{ icon: 'ti-zzz', l: 'Müde', v: 'müde' }, { icon: 'ti-flame', l: 'Gestresst', v: 'gestresst' }, { icon: 'ti-mood-smile', l: 'Okay', v: 'okay' }, { icon: 'ti-bolt', l: 'Fit', v: 'fit' }].map(m => (
                    <button key={m.v} onClick={() => setMood(m.v)} style={{ padding: '14px 6px', borderRadius: 'var(--border-radius-md)', border: `${mood === m.v ? '2px' : '0.5px'} solid ${mood === m.v ? '#7F77DD' : 'var(--color-border-tertiary)'}`, background: mood === m.v ? '#EEEDFE' : 'var(--color-background-secondary)', cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '6px', transition: 'all 0.15s' }}>
                      <i className={`ti ${m.icon}`} style={{ fontSize: '22px', color: mood === m.v ? '#534AB7' : 'var(--color-text-secondary)' }} />
                      <span style={{ fontSize: '11px', color: mood === m.v ? '#534AB7' : 'var(--color-text-secondary)', fontWeight: mood === m.v ? 500 : 400 }}>{m.l}</span>
                    </button>
                  ))}
                </div>
              </div>
              <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '20px', border: '0.5px solid var(--color-border-secondary)' }}>
                <p style={{ fontSize: '11px', fontWeight: 500, color: 'var(--color-text-secondary)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '14px' }}>Energielevel heute</p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  {[
                    { v: 'niedrig', l: 'Niedrig', icon: 'ti-battery-1', col: '#D85A30', bg: '#FAECE7', tc: '#993C1D' },
                    { v: 'mittel', l: 'Mittel', icon: 'ti-battery-3', col: '#BA7517', bg: '#FAEEDA', tc: '#854F0B' },
                    { v: 'hoch', l: 'Hoch', icon: 'ti-battery-4', col: '#0F6E56', bg: '#E1F5EE', tc: '#085041' },
                  ].map(e => (
                    <button key={e.v} onClick={() => setEnergy(e.v)} style={{ padding: '11px 14px', borderRadius: 'var(--border-radius-md)', border: `${energy === e.v ? '2px' : '0.5px'} solid ${energy === e.v ? e.col : 'var(--color-border-tertiary)'}`, background: energy === e.v ? e.bg : 'var(--color-background-secondary)', cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '12px', transition: 'all 0.15s' }}>
                      <i className={`ti ${e.icon}`} style={{ fontSize: '22px', color: energy === e.v ? e.col : 'var(--color-text-secondary)' }} />
                      <span style={{ fontSize: '13px', fontWeight: energy === e.v ? 500 : 400, color: energy === e.v ? e.tc : 'var(--color-text-primary)' }}>{e.l}</span>
                      {energy === e.v && <i className="ti ti-check" style={{ fontSize: '14px', color: e.col, marginLeft: 'auto' }} />}
                    </button>
                  ))}
                </div>
              </div>
            </div>
            {energy && mood && (
              <div style={{ background: '#EEEDFE', borderRadius: 'var(--border-radius-lg)', padding: '18px 20px', border: '0.5px solid #AFA9EC', animation: 'fadeIn 0.3s ease', display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '16px' }}>
                <div>
                  <p style={{ fontSize: '10px', fontWeight: 500, color: '#534AB7', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '4px' }}>Dein Modus heute</p>
                  <p style={{ fontSize: '18px', fontWeight: 500, color: '#3C3489', marginBottom: '4px' }}>
                    {energy === 'niedrig' ? 'Sanfter Einstieg' : energy === 'mittel' ? 'Balanced Day' : 'Flow-Modus aktiv'}
                  </p>
                  <p style={{ fontSize: '12px', color: '#534AB7', lineHeight: 1.5 }}>
                    {energy === 'niedrig' ? 'Leichte Admin-Tasks zuerst · Puffer eingeplant' : energy === 'mittel' ? '2× 45 min Fokus-Blöcke · Mix aus Kreativ & Admin' : 'Präsentation priorisiert · Langer Fokus-Block'}
                  </p>
                </div>
                <div style={{ padding: '10px 14px', background: 'rgba(83,74,183,0.1)', borderRadius: 'var(--border-radius-md)', fontSize: '11px', color: '#3C3489', textAlign: 'center', flexShrink: 0, marginLeft: '20px' }}>
                  <i className="ti ti-users" style={{ fontSize: '14px', display: 'block', marginBottom: '4px' }} />
                  Energie {energy}<br />ans Team gesendet
                </div>
              </div>
            )}
            <button onClick={handleStart} style={{ width: '100%', padding: '14px', background: energy && mood ? '#7F77DD' : 'var(--color-background-secondary)', color: energy && mood ? '#EEEDFE' : 'var(--color-text-tertiary)', border: 'none', borderRadius: 'var(--border-radius-lg)', fontSize: '15px', fontWeight: 500, cursor: energy && mood ? 'pointer' : 'not-allowed', transition: 'all 0.2s' }}>
              {energy && mood ? 'Tag starten →' : 'Mood & Energie wählen'}
            </button>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // ─────────────────────────────────────────────
    // PLANT SVG
    // ─────────────────────────────────────────────
    function PlantSVG({ stage }) {
      const renderFlower = (cx, cy, petalR, centerR, petalColor, centerColor, n = 6) => (
        <>
          {Array.from({ length: n }).map((_, i) => {
            const angle = (i * 360) / n;
            const rad = (angle * Math.PI) / 180;
            const px = cx + Math.cos(rad) * (centerR + petalR * 0.6);
            const py = cy + Math.sin(rad) * (centerR + petalR * 0.6);
            return (
              <ellipse key={i} cx={px} cy={py}
                rx={petalR} ry={petalR * 0.52}
                fill={petalColor}
                transform={`rotate(${angle} ${px} ${py})`} />
            );
          })}
          <circle cx={cx} cy={cy} r={centerR} fill={centerColor} />
          <circle cx={cx - centerR * 0.25} cy={cy - centerR * 0.25} r={centerR * 0.35} fill="rgba(255,255,255,0.25)" />
        </>
      );

      const Pot = () => (
        <g>
          {/* rim */}
          <rect x="26" y="84" width="52" height="9" rx="4" fill="#C27B5A" />
          <rect x="27" y="84" width="50" height="4" rx="3" fill="#D4936A" />
          {/* body */}
          <path d="M30 93 Q29 110 50 113 Q71 110 70 93 Z" fill="#D4936A" />
          <path d="M30 93 Q29 110 50 113 Q71 110 70 93" fill="none" stroke="#C27B5A" strokeWidth="0.5" />
          {/* body highlight */}
          <path d="M35 95 Q34 107 42 110" stroke="rgba(255,255,255,0.18)" strokeWidth="2.5" fill="none" strokeLinecap="round" />
          {/* soil */}
          <ellipse cx="52" cy="85" rx="24" ry="5" fill="#6B4230" />
          <ellipse cx="45" cy="84" rx="8" ry="2" fill="#7A5040" opacity="0.55" />
        </g>
      );

      if (stage === 'welk') {
        return (
          <svg viewBox="0 0 104 122" width="104" height="122" style={{ animation: 'droop 5s ease-in-out infinite' }}>
            {/* Dry pot – darker cracked soil */}
            <g>
              <rect x="26" y="84" width="52" height="9" rx="4" fill="#C27B5A" />
              <rect x="27" y="84" width="50" height="4" rx="3" fill="#D4936A" />
              <path d="M30 93 Q29 110 50 113 Q71 110 70 93 Z" fill="#D4936A" />
              <path d="M30 93 Q29 110 50 113 Q71 110 70 93" fill="none" stroke="#C27B5A" strokeWidth="0.5" />
              <path d="M35 95 Q34 107 42 110" stroke="rgba(255,255,255,0.18)" strokeWidth="2.5" fill="none" strokeLinecap="round" />
              {/* dry, cracked soil */}
              <ellipse cx="52" cy="85" rx="24" ry="5" fill="#4A2D1E" />
              <path d="M42 84 Q44 82 46 84" stroke="#3A2010" strokeWidth="0.8" fill="none" strokeLinecap="round" />
              <path d="M54 85 Q57 83 59 85" stroke="#3A2010" strokeWidth="0.8" fill="none" strokeLinecap="round" />
              <path d="M48 87 Q50 85 52 87" stroke="#3A2010" strokeWidth="0.7" fill="none" strokeLinecap="round" />
            </g>
            {/* drooping stem – leans right then curves down */}
            <path d="M52 84 Q56 74 64 65 Q70 58 68 48" stroke="#8B6914" strokeWidth="3" fill="none" strokeLinecap="round" />
            {/* left leaf – drooping downward, yellowed */}
            <path d="M56 76 Q50 82 44 88 Q40 84 46 78 Z" fill="#C4A030" />
            <path d="M56 76 Q48 83 44 88" stroke="rgba(255,255,255,0.2)" strokeWidth="0.6" fill="none" strokeLinecap="round" />
            {/* right leaf – drooping down-right, yellowed */}
            <path d="M62 68 Q68 73 72 80 Q68 82 63 74 Z" fill="#B89428" />
            <path d="M62 68 Q69 73 72 80" stroke="rgba(255,255,255,0.2)" strokeWidth="0.6" fill="none" strokeLinecap="round" />
            {/* small wilted bud at top – curled inward */}
            <path d="M68 48 Q72 43 70 38 Q66 40 68 48 Z" fill="#C4A030" opacity="0.9" />
            <path d="M68 48 Q64 44 65 38 Q68 39 68 48 Z" fill="#A07828" opacity="0.8" />
            {/* tiny water-need dots */}
            <circle cx="76" cy="30" r="2" fill="#AFA9EC" opacity="0.5" />
            <circle cx="82" cy="25" r="1.5" fill="#AFA9EC" opacity="0.35" />
            <circle cx="79" cy="20" r="1" fill="#AFA9EC" opacity="0.25" />
          </svg>
        );
      }

      if (stage === 'trieb') {
        return (
          <svg viewBox="0 0 104 122" width="104" height="122">
            <Pot />
            {/* single stem */}
            <path d="M52 84 Q52 73 51 61" stroke="#1D9E75" strokeWidth="3" fill="none" strokeLinecap="round" />
            {/* left leaf */}
            <path d="M51 73 Q40 67 36 62 Q40 59 47 65 Z" fill="#2DBF85" />
            {/* right leaf */}
            <path d="M51 78 Q62 72 65 66 Q61 63 55 70 Z" fill="#1D9E75" />
            {/* leaf veins */}
            <path d="M51 73 Q43 66 36 62" stroke="rgba(255,255,255,0.3)" strokeWidth="0.8" fill="none" strokeLinecap="round" />
            <path d="M51 78 Q59 70 65 66" stroke="rgba(255,255,255,0.3)" strokeWidth="0.8" fill="none" strokeLinecap="round" />
            {/* bud */}
            <ellipse cx="51" cy="59" rx="5" ry="6.5" fill="#5DCAA5" />
            <ellipse cx="51" cy="56" rx="3" ry="2.5" fill="#7FD9B8" />
          </svg>
        );
      }

      if (stage === 'bluehend') {
        return (
          <svg viewBox="0 0 104 122" width="104" height="122">
            <Pot />
            {/* main stem */}
            <path d="M52 84 Q53 68 52 44" stroke="#1D9E75" strokeWidth="3" fill="none" strokeLinecap="round" />
            {/* left branch */}
            <path d="M52 66 Q41 58 31 53" stroke="#1D9E75" strokeWidth="2" fill="none" strokeLinecap="round" />
            {/* right branch */}
            <path d="M52 59 Q63 52 71 47" stroke="#1D9E75" strokeWidth="2" fill="none" strokeLinecap="round" />
            {/* main leaves */}
            <path d="M52 74 Q38 70 33 62 Q40 58 50 68 Z" fill="#2DBF85" />
            <path d="M52 78 Q66 73 70 64 Q62 60 54 72 Z" fill="#1D9E75" />
            {/* branch leaves */}
            <path d="M31 53 Q22 47 20 40 Q26 38 34 48 Z" fill="#2DBF85" />
            <path d="M71 47 Q80 40 82 33 Q76 31 68 42 Z" fill="#1D9E75" />
            {/* leaf veins */}
            <path d="M52 74 Q40 67 33 62" stroke="rgba(255,255,255,0.3)" strokeWidth="0.7" fill="none" strokeLinecap="round" />
            <path d="M52 78 Q63 71 70 64" stroke="rgba(255,255,255,0.3)" strokeWidth="0.7" fill="none" strokeLinecap="round" />
            {/* main flower */}
            {renderFlower(52, 42, 7, 6, '#FAD06A', '#F0A030')}
          </svg>
        );
      }

      // volle Blüte
      return (
        <svg viewBox="0 0 104 122" width="104" height="122">
          <Pot />
          {/* main stem */}
          <path d="M52 84 Q53 66 52 34" stroke="#1D9E75" strokeWidth="3" fill="none" strokeLinecap="round" />
          {/* branches */}
          <path d="M52 72 Q38 62 26 56" stroke="#1D9E75" strokeWidth="2.2" fill="none" strokeLinecap="round" />
          <path d="M52 63 Q66 54 76 48" stroke="#1D9E75" strokeWidth="2.2" fill="none" strokeLinecap="round" />
          <path d="M52 52 Q39 44 29 40" stroke="#1D9E75" strokeWidth="1.8" fill="none" strokeLinecap="round" />
          {/* lush main leaves */}
          <path d="M52 76 Q36 72 29 62 Q38 57 51 70 Z" fill="#2DBF85" />
          <path d="M52 80 Q68 75 74 64 Q64 59 53 74 Z" fill="#1D9E75" />
          {/* branch leaves */}
          <path d="M26 56 Q14 49 12 41 Q20 38 28 50 Z" fill="#2DBF85" />
          <path d="M76 48 Q86 40 88 32 Q80 30 72 43 Z" fill="#1D9E75" />
          <path d="M29 40 Q20 33 18 26 Q25 23 32 35 Z" fill="#4CAF82" />
          {/* leaf veins */}
          <path d="M52 76 Q38 68 29 62" stroke="rgba(255,255,255,0.28)" strokeWidth="0.7" fill="none" strokeLinecap="round" />
          <path d="M52 80 Q65 72 74 64" stroke="rgba(255,255,255,0.28)" strokeWidth="0.7" fill="none" strokeLinecap="round" />
          {/* center flower (large) */}
          {renderFlower(52, 32, 8, 6.5, '#FAD06A', '#F0A030', 8)}
          {/* left flower */}
          {renderFlower(24, 48, 5.5, 4.5, '#B8A9F5', '#7F77DD', 6)}
          {/* right flower */}
          {renderFlower(78, 41, 5.5, 4.5, '#FAD06A', '#E8921E', 6)}
          {/* sparkles */}
          <text x="7" y="24" fontSize="10" style={{ userSelect: 'none' }}>✨</text>
          <text x="83" y="20" fontSize="10" style={{ userSelect: 'none' }}>✨</text>
          <text x="46" y="14" fontSize="8" style={{ userSelect: 'none' }}>✦</text>
        </svg>
      );
    }

    // ─────────────────────────────────────────────
    // PLANT WIDGET
    // ─────────────────────────────────────────────
    function PlantWidget({ completedCount, wilted }) {
      const isWilted = wilted && completedCount < 3;
      const stage = isWilted
        ? 'welk'
        : completedCount >= 5 ? 'voll' : completedCount >= 2 ? 'bluehend' : 'trieb';

      const remaining = Math.max(0, 3 - completedCount);

      const info = isWilted
        ? {
          label: 'Braucht Wasser 💧',
          msg: 'Du hast deine Pflanze gestern nicht gegossen. Gieße sie, indem du 3 Aufgaben erledigst.',
          badge: { bg: '#FAEEDA', tx: '#854F0B' },
        }
        : {
          trieb: {
            label: 'Junger Trieb',
            msg: 'Erledige 2 Aufgaben – dann wächst deine Pflanze weiter.',
            badge: { bg: '#E1F5EE', tx: '#0F6E56' },
          },
          bluehend: {
            label: 'Blühende Pflanze',
            msg: 'Du bist im Flow! Noch mehr Aufgaben und sie erblüht vollständig.',
            badge: { bg: '#E1F5EE', tx: '#0F6E56' },
          },
          voll: {
            label: 'Volle Blüte ✨',
            msg: 'Heute alles geschafft – was für ein Tag!',
            badge: { bg: '#EEEDFE', tx: '#534AB7' },
          },
        }[stage];

      return (
        <div style={{
          background: 'var(--color-background-primary)',
          borderRadius: 'var(--border-radius-lg)',
          padding: '16px 18px',
          border: isWilted ? '0.5px solid #F0C880' : '0.5px solid var(--color-border-secondary)',
          transition: 'border-color 0.4s ease',
        }}>
          {/* Header */}
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '4px' }}>
            <p style={{ fontSize: '11px', fontWeight: 500, color: 'var(--color-text-secondary)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>
              <i className="ti ti-plant-2" style={{ fontSize: '12px', marginRight: '5px', color: isWilted ? '#BA7517' : '#1D9E75' }} />Deine Pflanze
            </p>
            <span style={{
              fontSize: '10px', padding: '2px 8px',
              borderRadius: 'var(--border-radius-sm)',
              background: info.badge.bg, color: info.badge.tx, fontWeight: 500,
            }}>
              {info.label}
            </span>
          </div>

          {/* Plant illustration */}
          <div key={stage} style={{ display: 'flex', justifyContent: 'center', padding: '6px 0 4px', animation: 'fadeIn 0.5s ease' }}>
            <PlantSVG stage={stage} />
          </div>

          {/* Message */}
          <p style={{ fontSize: '12px', color: isWilted ? '#854F0B' : 'var(--color-text-secondary)', textAlign: 'center', lineHeight: 1.5, marginBottom: '12px' }}>
            {info.msg}
          </p>

          {/* Progress — watering mode when wilted */}
          {isWilted ? (
            <div style={{ background: '#FAEEDA', borderRadius: 'var(--border-radius-md)', padding: '8px 12px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
              <div style={{ display: 'flex', gap: '5px' }}>
                {[0, 1, 2].map(i => (
                  <div key={i} style={{
                    width: '28px', height: '6px', borderRadius: '3px',
                    background: i < completedCount ? '#1D9E75' : '#F0C880',
                    transition: 'background 0.4s ease',
                  }} />
                ))}
              </div>
              <span style={{ fontSize: '11px', color: '#854F0B', fontWeight: 500 }}>
                {remaining > 0 ? `Noch ${remaining} Aufgabe${remaining > 1 ? 'n' : ''}` : 'Fast gerettet!'}
              </span>
            </div>
          ) : (
            <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
              {Array.from({ length: 5 }).map((_, i) => (
                <div key={i} style={{
                  flex: 1, height: '5px', borderRadius: '3px',
                  background: i < completedCount ? '#1D9E75' : 'var(--color-border-tertiary)',
                  transition: 'background 0.4s ease',
                }} />
              ))}
              <span style={{ fontSize: '10px', color: 'var(--color-text-tertiary)', marginLeft: '5px', flexShrink: 0 }}>
                {completedCount}/5
              </span>
            </div>
          )}
        </div>
      );
    }

    const sourceInfo = {
      email: { label: 'E-Mail', icon: 'ti-mail', color: '#185FA5', bg: '#E6F1FB' },
      whatsapp: { label: 'WhatsApp', icon: 'ti-brand-whatsapp', color: '#0F6E56', bg: '#E1F5EE' },
      slack: { label: 'Slack', icon: 'ti-brand-slack', color: '#6B3C89', bg: '#F6EEFB' },
      eigene: { label: 'Eigene', icon: 'ti-user', color: '#534AB7', bg: '#EEEDFE' },
    };

    // DASHBOARD
    // ─────────────────────────────────────────────
    function Dashboard({
      sorted, tasks, toggle, energy, energyStyle, setScreen, setActiveTask,
      microstepProgress, onOpenMicrosteps, invisibleWork, simulated, onSimulate,
      isTodayTasksExpanded, setIsTodayTasksExpanded,
      isIncomingTasksExpanded, setIsIncomingTasksExpanded,
      incomingFilter, setIncomingFilter, onAddTask, onStartDoubling
    }) {
      const [newTitle, setNewTitle] = useState('');
      const sortedTasks = sorted();
      const todayTasks = sortedTasks.filter(t => !t.isIncoming);
      const incomingTasks = sortedTasks.filter(t => t.isIncoming);
      const waitingTasks = tasks.filter(t => !t.done && t.dependsOn);

      // Top focus task is the first undone today's task
      const topTodayTask = todayTasks.find(t => !t.done);

      // Remaining daily tasks list (excludes the top undone task if it exists)
      const todayListTasks = todayTasks.filter(t => !topTodayTask || t.id !== topTodayTask.id);
      const todayListTasksToShow = todayListTasks.slice(0, 6);

      // Filtered incoming tasks list
      const filteredIncoming = incomingTasks.filter(
        t => incomingFilter === 'all' || t.source === incomingFilter
      );

      const done = tasks.filter(t => t.done).length;

      const handleAddSubmit = (e) => {
        e.preventDefault();
        if (!newTitle.trim()) return;
        onAddTask(newTitle);
        setNewTitle('');
      };

      const renderTaskItem = (task, index, listArray) => {
        const prog = microstepProgress[task.id] || 0;
        const sInfo = sourceInfo[task.source] || sourceInfo.eigene;
        const isBorder = index < listArray.length - 1;

        return (
          <div key={task.id} className="task-row" style={{ padding: '13px 22px', display: 'flex', alignItems: 'center', gap: '12px', borderBottom: isBorder ? '0.5px solid var(--color-border-tertiary)' : 'none', opacity: task.done ? 0.45 : 1, background: 'transparent', transition: 'background 0.12s' }}>
            <div onClick={() => toggle(task.id)} style={{ width: '20px', height: '20px', borderRadius: '6px', flexShrink: 0, border: `1.5px solid ${task.done ? '#1D9E75' : 'var(--color-border-secondary)'}`, background: task.done ? '#1D9E75' : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s', cursor: 'pointer' }}>
              {task.done && <i className="ti ti-check" style={{ fontSize: '12px', color: 'white' }} />}
            </div>
            <div style={{ flex: 1, minWidth: 0, cursor: 'pointer' }} onClick={() => onOpenMicrosteps(task)}>
              <p style={{ fontSize: '13px', color: 'var(--color-text-primary)', textDecoration: task.done ? 'line-through' : 'none', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>{task.title}</p>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '3px', flexWrap: 'wrap' }}>
                <p style={{ fontSize: '11px', color: 'var(--color-text-tertiary)' }}>{task.deadline}</p>
                {!task.isIncoming && (
                  <span style={{ display: 'inline-flex', alignItems: 'center', gap: '4px', fontSize: '9px', fontWeight: 500, color: sInfo.color, background: sInfo.bg, padding: '2px 6px', borderRadius: '4px' }}>
                    <i className={`ti ${sInfo.icon}`} style={{ fontSize: '9px' }} />
                    {sInfo.label}
                  </span>
                )}
                {task.dependsOn && !task.done && (
                  <span style={{ display: 'flex', alignItems: 'center', gap: '4px', fontSize: '10px', color: '#854F0B', background: '#FAEEDA', padding: '2px 7px', borderRadius: 'var(--border-radius-sm)', border: '0.5px solid #F0C88060' }}>
                    <div style={{ width: '14px', height: '14px', borderRadius: '4px', background: task.dependsOn.bg, color: task.dependsOn.col, fontSize: '7px', fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{task.dependsOn.init}</div>
                    {task.dependsOn.name.split(' ')[0]} wartet
                  </span>
                )}
                {prog > 0 && !task.done && (
                  <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                    <div style={{ display: 'flex', gap: '2px' }}>
                      {[0, 1, 2, 3, 4].map(s => <div key={s} style={{ width: '8px', height: '4px', borderRadius: '1px', background: s < prog ? '#7F77DD' : 'var(--color-border-tertiary)', transition: 'background 0.2s' }} />)}
                    </div>
                    <span style={{ fontSize: '10px', color: '#534AB7' }}>{prog}/5</span>
                  </div>
                )}
              </div>
            </div>
            <div style={{ display: 'flex', alignItems: 'center', gap: '7px', flexShrink: 0 }}>
              {energy && task.eng === energy && <span style={{ width: '7px', height: '7px', borderRadius: '50%', background: '#1D9E75', display: 'block' }} title="Passt zur Energie" />}
              <span style={{ fontSize: '11px', padding: '3px 8px', borderRadius: 'var(--border-radius-sm)', background: pStyle[task.priority].bg, color: pStyle[task.priority].tx }}>{pStyle[task.priority].lbl}</span>
              <button onClick={() => onOpenMicrosteps(task)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', color: 'var(--color-text-tertiary)', padding: '2px', display: 'flex', alignItems: 'center' }} title="Microsteps öffnen">
                <i className="ti ti-stairs-up" style={{ fontSize: '14px' }} />
              </button>
            </div>
          </div>
        );
      };

      return (
        <div style={{ padding: '24px', display: 'grid', gridTemplateColumns: '1fr 340px', gap: '20px', alignItems: 'start' }}>

          {/* Left: progress + task list */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>
            <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '20px 22px', border: '0.5px solid var(--color-border-secondary)' }}>
              <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: '12px' }}>
                <div>
                  <h2 style={{ fontSize: '17px', fontWeight: 500, color: 'var(--color-text-primary)' }}>Aufgaben heute</h2>
                  <p style={{ fontSize: '12px', color: 'var(--color-text-secondary)', marginTop: '2px' }}>{done} von {tasks.length} erledigt</p>
                </div>
                <span style={{ fontSize: '30px', fontWeight: 400, color: '#534AB7', fontVariantNumeric: 'tabular-nums', lineHeight: 1 }}>
                  {Math.round((done / tasks.length) * 100)}%
                </span>
              </div>
              <div style={{ height: '4px', background: 'var(--color-border-tertiary)', borderRadius: '2px' }}>
                <div style={{ height: '100%', background: '#7F77DD', borderRadius: '2px', width: `${Math.round((done / tasks.length) * 100)}%`, transition: 'width 0.3s ease' }} />
              </div>
            </div>

            {/* Wichtigste priorisierte Aufgabe */}
            {topTodayTask ? (
              <div style={{ background: '#EEEDFE', borderRadius: 'var(--border-radius-lg)', padding: '20px 22px', border: '0.5px solid #AFA9EC', animation: 'fadeIn 0.3s ease' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '10px' }}>
                  <span style={{ fontSize: '10px', fontWeight: 500, color: '#534AB7', textTransform: 'uppercase', letterSpacing: '0.06em' }}>
                    <i className="ti ti-star" style={{ fontSize: '11px', marginRight: '4px' }} />Wichtigste priorisierte Aufgabe
                  </span>
                  <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                    {energy && topTodayTask.eng === energy && <span style={{ fontSize: '10px', padding: '2px 7px', borderRadius: '4px', background: '#E1F5EE', color: '#0F6E56', fontWeight: 500 }}>Passt zur Energie</span>}
                    <span style={{ fontSize: '11px', padding: '3px 8px', borderRadius: 'var(--border-radius-sm)', background: pStyle[topTodayTask.priority].bg, color: pStyle[topTodayTask.priority].tx }}>{pStyle[topTodayTask.priority].lbl}</span>
                  </div>
                </div>
                <div style={{ display: 'flex', alignItems: 'flex-start', gap: '12px', marginBottom: '14px' }}>
                  <div onClick={() => toggle(topTodayTask.id)} style={{ width: '22px', height: '22px', borderRadius: '6px', flexShrink: 0, border: `1.5px solid ${topTodayTask.done ? '#1D9E75' : '#7F77DD'}`, background: topTodayTask.done ? '#1D9E75' : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 0.15s', cursor: 'pointer', marginTop: '2px' }}>
                    {topTodayTask.done && <i className="ti ti-check" style={{ fontSize: '14px', color: 'white' }} />}
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <p style={{ fontSize: '16px', fontWeight: 500, color: '#3C3489', lineHeight: 1.4 }}>{topTodayTask.title}</p>
                    <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginTop: '6px', flexWrap: 'wrap' }}>
                      <span style={{ fontSize: '12px', color: '#534AB7' }}>
                        <i className="ti ti-calendar" style={{ fontSize: '13px', verticalAlign: '-2px', marginRight: '4px' }} />{topTodayTask.deadline}
                      </span>
                      <span style={{ display: 'inline-flex', alignItems: 'center', gap: '4px', fontSize: '9px', fontWeight: 500, color: (sourceInfo[topTodayTask.source] || sourceInfo.eigene).color, background: (sourceInfo[topTodayTask.source] || sourceInfo.eigene).bg, padding: '2px 6px', borderRadius: '4px' }}>
                        <i className={`ti ${(sourceInfo[topTodayTask.source] || sourceInfo.eigene).icon}`} style={{ fontSize: '9px' }} />
                        {(sourceInfo[topTodayTask.source] || sourceInfo.eigene).label}
                      </span>
                      {topTodayTask.dependsOn && (
                        <span style={{ display: 'flex', alignItems: 'center', gap: '4px', fontSize: '10px', color: '#854F0B', background: '#FAEEDA', padding: '2px 7px', borderRadius: 'var(--border-radius-sm)', border: '0.5px solid #F0C88060' }}>
                          <div style={{ width: '14px', height: '14px', borderRadius: '4px', background: topTodayTask.dependsOn.bg, color: topTodayTask.dependsOn.col, fontSize: '7px', fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>{topTodayTask.dependsOn.init}</div>
                          {topTodayTask.dependsOn.name.split(' ')[0]} wartet
                        </span>
                      )}
                      {(microstepProgress[topTodayTask.id] || 0) > 0 && (
                        <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
                          <div style={{ display: 'flex', gap: '2px' }}>
                            {[0, 1, 2, 3, 4].map(s => <div key={s} style={{ width: '8px', height: '4px', borderRadius: '1px', background: s < (microstepProgress[topTodayTask.id] || 0) ? '#7F77DD' : '#C0BCEC', transition: 'background 0.2s' }} />)}
                          </div>
                          <span style={{ fontSize: '10px', color: '#534AB7' }}>{microstepProgress[topTodayTask.id]}/5</span>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
                <div style={{ display: 'flex', gap: '8px', justifyContent: 'flex-end', borderTop: '0.5px solid #C0BCEC50', paddingTop: '12px' }}>
                  <button onClick={() => onOpenMicrosteps(topTodayTask)} style={{ padding: '8px 14px', background: 'white', color: '#534AB7', border: '0.5px solid #AFA9EC', borderRadius: 'var(--border-radius-md)', fontSize: '12px', fontWeight: 500, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px' }}>
                    <i className="ti ti-stairs-up" style={{ fontSize: '14px' }} /> Microsteps
                  </button>
                  <button onClick={() => onStartDoubling(topTodayTask)} style={{ padding: '8px 14px', background: '#7F77DD', color: '#EEEDFE', border: 'none', borderRadius: 'var(--border-radius-md)', fontSize: '12px', fontWeight: 500, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px' }}>
                    <i className="ti ti-users" style={{ fontSize: '14px' }} /> Body-Doubling
                  </button>
                </div>
              </div>
            ) : (
              <div style={{ background: '#E1F5EE', borderRadius: 'var(--border-radius-lg)', padding: '24px', border: '0.5px solid #5DCAA580', textAlign: 'center', animation: 'fadeIn 0.3s ease' }}>
                <i className="ti ti-circle-check" style={{ fontSize: '36px', color: '#1D9E75', marginBottom: '8px', display: 'block' }} />
                <p style={{ fontSize: '16px', fontWeight: 500, color: '#085041', marginBottom: '4px' }}>Hervorragende Arbeit!</p>
                <p style={{ fontSize: '13px', color: '#0F6E56' }}>Du hast alle Aufgaben für heute erledigt. Genieß deinen Tag!</p>
              </div>
            )}

            {/* Eingebefeld für eigene Aufgaben */}
            <form onSubmit={handleAddSubmit} style={{ display: 'flex', gap: '8px', background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '10px 14px', border: '0.5px solid var(--color-border-secondary)' }}>
              <i className="ti ti-plus" style={{ fontSize: '16px', color: '#7F77DD', marginTop: '3px' }} />
              <input
                type="text"
                placeholder="Neue eigene Aufgabe für heute hinzufügen... (Eingabetaste)"
                value={newTitle}
                onChange={e => setNewTitle(e.target.value)}
                style={{ flex: 1, border: 'none', outline: 'none', fontFamily: 'inherit', fontSize: '13px', color: 'var(--color-text-primary)' }}
              />
              {newTitle.trim() && (
                <button type="submit" style={{ background: '#EEEDFE', border: '0.5px solid #AFA9EC', color: '#534AB7', padding: '4px 10px', borderRadius: 'var(--border-radius-sm)', fontSize: '11px', fontWeight: 500, cursor: 'pointer', transition: 'all 0.15s' }}>
                  Hinzufügen
                </button>
              )}
            </form>

            {/* Aufgaben des Tages collapsible */}
            <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-secondary)', overflow: 'hidden' }}>
              <div onClick={() => setIsTodayTasksExpanded(!isTodayTasksExpanded)} style={{ padding: '14px 22px', borderBottom: isTodayTasksExpanded ? '0.5px solid var(--color-border-tertiary)' : 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer', userSelect: 'none' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <i className="ti ti-calendar-event" style={{ fontSize: '16px', color: '#7F77DD' }} />
                  <p style={{ fontSize: '12px', fontWeight: 500, color: 'var(--color-text-secondary)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>Aufgaben des Tages</p>
                  <span style={{ fontSize: '11px', background: 'var(--color-background-secondary)', color: 'var(--color-text-secondary)', padding: '2px 8px', borderRadius: '10px', fontWeight: 500 }}>
                    {todayListTasksToShow.length}
                  </span>
                </div>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  {isTodayTasksExpanded && energy && <p style={{ fontSize: '11px', color: 'var(--color-text-tertiary)', display: 'flex', alignItems: 'center', gap: '5px' }}><span style={{ width: '7px', height: '7px', borderRadius: '50%', background: '#1D9E75', display: 'inline-block' }} /> Passend zu Energie {energy}</p>}
                  <i className={`ti ${isTodayTasksExpanded ? 'ti-chevron-up' : 'ti-chevron-down'}`} style={{ fontSize: '16px', color: 'var(--color-text-tertiary)' }} />
                </div>
              </div>
              {isTodayTasksExpanded && (
                <div style={{ animation: 'fadeIn 0.2s ease' }}>
                  {todayListTasksToShow.length === 0 ? (
                    <div style={{ padding: '22px', textAlign: 'center', color: 'var(--color-text-tertiary)', fontSize: '13px' }}>
                      Keine weiteren Aufgaben für heute.
                    </div>
                  ) : (
                    todayListTasksToShow.map((task, i) => renderTaskItem(task, i, todayListTasksToShow))
                  )}
                </div>
              )}
            </div>

            {/* Eingegangene Aufgaben collapsible */}
            <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid var(--color-border-secondary)', overflow: 'hidden' }}>
              <div onClick={() => setIsIncomingTasksExpanded(!isIncomingTasksExpanded)} style={{ padding: '14px 22px', borderBottom: isIncomingTasksExpanded ? '0.5px solid var(--color-border-tertiary)' : 'none', display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer', userSelect: 'none' }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '8px' }}>
                  <i className="ti ti-inbox" style={{ fontSize: '16px', color: '#7F77DD' }} />
                  <p style={{ fontSize: '12px', fontWeight: 500, color: 'var(--color-text-secondary)', textTransform: 'uppercase', letterSpacing: '0.06em' }}>Eingegangene Aufgaben</p>
                  <span style={{ fontSize: '11px', background: 'var(--color-background-secondary)', color: 'var(--color-text-secondary)', padding: '2px 8px', borderRadius: '10px', fontWeight: 500 }}>
                    {filteredIncoming.length}
                  </span>
                </div>
                <i className={`ti ${isIncomingTasksExpanded ? 'ti-chevron-up' : 'ti-chevron-down'}`} style={{ fontSize: '16px', color: 'var(--color-text-tertiary)' }} />
              </div>
              {isIncomingTasksExpanded && (
                <div style={{ animation: 'fadeIn 0.2s ease' }}>
                  {/* Source filter bar */}
                  <div style={{ display: 'flex', gap: '6px', padding: '12px 20px', borderBottom: '0.5px solid var(--color-border-tertiary)', background: 'var(--color-background-secondary)', flexWrap: 'wrap' }}>
                    {[
                      { v: 'all', l: 'Alle', icon: 'ti-list' },
                      { v: 'email', l: 'E-Mail', icon: 'ti-mail' },
                      { v: 'whatsapp', l: 'WhatsApp', icon: 'ti-brand-whatsapp' },
                      { v: 'slack', l: 'Slack', icon: 'ti-brand-slack' },
                      { v: 'eigene', l: 'Eigene', icon: 'ti-user' },
                    ].map(f => {
                      const isActive = incomingFilter === f.v;
                      return (
                        <button key={f.v} onClick={() => setIncomingFilter(f.v)} style={{ display: 'flex', alignItems: 'center', gap: '5px', padding: '5px 10px', borderRadius: '20px', background: isActive ? '#7F77DD' : 'var(--color-background-primary)', color: isActive ? '#EEEDFE' : 'var(--color-text-secondary)', border: isActive ? '0.5px solid #534AB7' : '0.5px solid var(--color-border-secondary)', fontSize: '11px', fontWeight: 500, cursor: 'pointer', transition: 'all 0.15s' }}>
                          <i className={`ti ${f.icon}`} style={{ fontSize: '12px' }} />
                          {f.l}
                        </button>
                      );
                    })}
                  </div>
                  {filteredIncoming.length === 0 ? (
                    <div style={{ padding: '22px', textAlign: 'center', color: 'var(--color-text-tertiary)', fontSize: '13px' }}>
                      Keine eingegangenen Aufgaben gefunden.
                    </div>
                  ) : (
                    filteredIncoming.map((task, i) => renderTaskItem(task, i, filteredIncoming))
                  )}
                </div>
              )}
            </div>

          </div>

          {/* Right: widgets */}
          <div style={{ display: 'flex', flexDirection: 'column', gap: '16px' }}>

            <div className="team-widget" onClick={() => setScreen(SCREENS.TEAM)} style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '16px 18px', border: '0.5px solid var(--color-border-secondary)', display: 'flex', alignItems: 'center', justifyContent: 'space-between', cursor: 'pointer', transition: 'background 0.12s' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '10px' }}>
                <div style={{ display: 'flex' }}>
                  {TEAM.slice(0, 3).map((m, i) => (
                    <div key={m.id} style={{ width: '28px', height: '28px', borderRadius: '50%', background: m.bg, color: m.col, fontSize: '10px', fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', marginLeft: i > 0 ? '-8px' : '0', border: '2px solid var(--color-background-primary)' }}>{m.init}</div>
                  ))}
                </div>
                <div>
                  <p style={{ fontSize: '13px', fontWeight: 500, color: 'var(--color-text-primary)' }}>Team</p>
                  <p style={{ fontSize: '11px', color: 'var(--color-text-tertiary)' }}>4 Kollegen online · Workspace öffnen</p>
                </div>
              </div>
              <i className="ti ti-arrow-right" style={{ fontSize: '16px', color: 'var(--color-text-tertiary)' }} />
            </div>

            {/* Waiting tasks (Jemand wartet auf dich) */}
            {waitingTasks.length > 0 && (
              <div style={{ background: 'var(--color-background-primary)', borderRadius: 'var(--border-radius-lg)', padding: '16px 18px', border: '0.5px solid var(--color-border-secondary)' }}>
                <p style={{ fontSize: '11px', fontWeight: 500, color: 'var(--color-text-secondary)', textTransform: 'uppercase', letterSpacing: '0.06em', marginBottom: '12px' }}>
                  <i className="ti ti-clock" style={{ fontSize: '12px', marginRight: '5px', color: '#BA7517' }} />Jemand wartet auf dich
                </p>
                <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                  {waitingTasks.map(task => (
                    <div key={task.id} style={{ display: 'flex', gap: '10px', padding: '10px 12px', background: '#FAEEDA', borderRadius: 'var(--border-radius-md)', border: '0.5px solid #F0C88040', alignItems: 'flex-start' }}>
                      <div style={{ width: '28px', height: '28px', borderRadius: '8px', background: task.dependsOn.bg, color: task.dependsOn.col, fontSize: '10px', fontWeight: 500, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: '2px' }}>
                        {task.dependsOn.init}
                      </div>
                      <div style={{ flex: 1, minWidth: 0 }}>
                        <p style={{ fontSize: '12px', fontWeight: 500, color: '#3C2A00' }}>{task.dependsOn.name}</p>
                        <p style={{ fontSize: '11px', color: '#854F0B', lineHeight: 1.3 }}>{task.dependsOn.reason}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            <PlantWidget completedCount={tasks.filter(t => t.done).length} wilted={simulated} />
            {!simulated && (
              <button onClick={onSimulate} style={{
                width: '100%', padding: '10px 14px',
                background: 'transparent',
                border: '1px dashed var(--color-border-secondary)',
                borderRadius: 'var(--border-radius-md)',
                fontSize: '11px', color: 'var(--color-text-tertiary)',
                cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '7px',
                transition: 'all 0.15s',
              }}
                onMouseEnter={e => { e.currentTarget.style.borderColor = '#AFA9EC'; e.currentTarget.style.color = '#534AB7'; }}
                onMouseLeave={e => { e.currentTarget.style.borderColor = 'var(--color-border-secondary)'; e.currentTarget.style.color = 'var(--color-text-tertiary)'; }}
              >
                <i className="ti ti-clock-2" style={{ fontSize: '13px' }} />
                Simulation: Zwei Tage später
              </button>
            )}
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // FREEZE
    // ─────────────────────────────────────────────
    function FreezeScreen({ bp, isExpanded, bLabels, setScreen, freezeCount }) {
      const [showReflect, setShowReflect] = useState(false);

      const empathyMsg = freezeCount >= 3
        ? { title: `Das ${freezeCount}. Mal heute, Alex.`, sub: 'Dein System sendet ein klares Signal. Wollen wir kurz schauen, was gerade so viel kostet?', showReflect: true }
        : freezeCount === 2
          ? { title: 'Schon das zweite Mal heute.', sub: 'Das passiert – und du machst das Richtige, indem du innehältst. Lass uns durchatmen.', showReflect: false }
          : { title: 'Alles gut, Alex.', sub: 'Lass uns kurz durchatmen.', showReflect: false };

      return (
        <div style={{ height: '100vh', background: '#26215C', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px', position: 'relative' }}>
          <button onClick={() => setScreen(SCREENS.DASHBOARD)} style={{ position: 'absolute', top: '24px', right: '24px', background: 'rgba(255,255,255,0.1)', border: 'none', borderRadius: '50%', width: '40px', height: '40px', color: '#CECBF6', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            <i className="ti ti-x" style={{ fontSize: '18px' }} />
          </button>

          <div style={{ textAlign: 'center', marginBottom: '48px' }}>
            <p style={{ fontSize: '11px', color: '#AFA9EC', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '10px' }}>Freeze-Modus</p>
            <h2 style={{ fontSize: '40px', fontWeight: 400, color: '#EEEDFE', lineHeight: 1.3, marginBottom: '10px' }}>{empathyMsg.title}</h2>
            <p style={{ fontSize: '17px', color: '#AFA9EC' }}>{empathyMsg.sub}</p>
            {empathyMsg.showReflect && !showReflect && (
              <button onClick={() => setShowReflect(true)} style={{ marginTop: '16px', padding: '10px 20px', background: 'rgba(127,119,221,0.2)', border: '0.5px solid #7F77DD', borderRadius: 'var(--border-radius-md)', color: '#CECBF6', fontSize: '13px', cursor: 'pointer' }}>
                <i className="ti ti-heart" style={{ fontSize: '13px', marginRight: '6px' }} />Ja, lass uns kurz reden
              </button>
            )}
          </div>

          {showReflect ? (
            <div style={{ width: '100%', maxWidth: '420px', background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.12)', borderRadius: 'var(--border-radius-lg)', padding: '24px', animation: 'fadeIn 0.3s ease', marginBottom: '32px' }}>
              <p style={{ fontSize: '13px', color: '#CECBF6', lineHeight: 1.7, marginBottom: '16px' }}>
                Mehrere Freeze-Momente hintereinander passieren oft, wenn sich zu viele Dinge gleichzeitig angestaut haben – Tasks, Erwartungen, Unterbrechungen. <br /><br />
                Das ist keine Schwäche. Das ist dein Nervensystem, das um Pause bittet.
              </p>
              <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                {['Zu viele offene Tasks', 'Zu wenig Pausen', 'Unklare Prioritäten', 'Sozialer Stress'].map(r => (
                  <button key={r} onClick={() => setScreen(SCREENS.DASHBOARD)} style={{ padding: '7px 12px', background: 'rgba(127,119,221,0.15)', border: '0.5px solid rgba(127,119,221,0.3)', borderRadius: 'var(--border-radius-md)', color: '#AFA9EC', fontSize: '11px', cursor: 'pointer' }}>{r}</button>
                ))}
              </div>
            </div>
          ) : (
            <>
              <div style={{ position: 'relative', width: '240px', height: '240px', display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: '32px' }}>
                <div style={{ position: 'absolute', width: isExpanded ? '230px' : '130px', height: isExpanded ? '230px' : '130px', borderRadius: '50%', background: 'rgba(127,119,221,0.08)', transition: 'all 4s ease-in-out' }} />
                <div style={{ position: 'absolute', width: isExpanded ? '180px' : '100px', height: isExpanded ? '180px' : '100px', borderRadius: '50%', background: 'rgba(127,119,221,0.14)', transition: 'all 4s ease-in-out' }} />
                <div style={{ width: isExpanded ? '130px' : '80px', height: isExpanded ? '130px' : '80px', borderRadius: '50%', background: '#3C3489', border: '1.5px solid #7F77DD', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'all 4s ease-in-out' }}>
                  <i className={`ti ${bp === 2 ? 'ti-wind' : 'ti-leaf'}`} style={{ fontSize: isExpanded ? '44px' : '28px', color: '#EEEDFE', transition: 'all 4s ease-in-out' }} />
                </div>
              </div>

              <div style={{ textAlign: 'center', marginBottom: '48px' }}>
                <p style={{ fontSize: '30px', fontWeight: 400, color: '#EEEDFE', letterSpacing: '0.02em', marginBottom: '8px' }}>{bLabels[bp]}</p>
                <p style={{ fontSize: '13px', color: '#AFA9EC' }}>4-2-6-2 Atemrhythmus</p>
              </div>
            </>
          )}

          <div style={{ width: '100%', maxWidth: '420px' }}>
            <p style={{ fontSize: '10px', color: '#AFA9EC', textTransform: 'uppercase', letterSpacing: '0.06em', textAlign: 'center', marginBottom: '12px' }}>Was überwältigt dich?</p>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '8px' }}>
              {[
                { icon: 'ti-stack-2', l: 'Zu viele Aufgaben auf einmal' },
                { icon: 'ti-clock-x', l: 'Deadline-Druck' },
                { icon: 'ti-brain', l: 'Kann nicht anfangen' },
                { icon: 'ti-messages', l: 'Zu viel Kommunikation' },
              ].map(o => (
                <button key={o.l} className="freeze-option" onClick={() => setScreen(SCREENS.DASHBOARD)} style={{ background: 'rgba(255,255,255,0.06)', border: '0.5px solid rgba(255,255,255,0.1)', borderRadius: 'var(--border-radius-md)', padding: '12px 14px', color: '#CECBF6', fontSize: '12px', cursor: 'pointer', textAlign: 'left', display: 'flex', alignItems: 'center', gap: '10px', transition: 'background 0.15s' }}>
                  <i className={`ti ${o.icon}`} style={{ fontSize: '16px', color: '#AFA9EC' }} />{o.l}
                </button>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─────────────────────────────────────────────
    // HYPERFOKUS-BLOCKER SCREEN
    // ─────────────────────────────────────────────
    function HyperfocusScreen({ tasks, setScreen }) {
      const [timer, setTimer] = useState(120); // 2 minutes
      const [active, setActive] = useState(true); // Auto-start the timer!

      useEffect(() => {
        let t;
        if (active && timer > 0) {
          t = setInterval(() => setTimer(v => v - 1), 1000);
        }
        return () => clearInterval(t);
      }, [active, timer]);

      const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

      // Filter for today's tasks (Aufgaben des Tages)
      const todayTasks = tasks.filter(t => !t.isIncoming);

      return (
        <div style={{ height: '100vh', background: '#1B1822', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '40px', position: 'relative', overflow: 'hidden' }}>
          <button onClick={() => setScreen(SCREENS.DASHBOARD)} style={{ position: 'absolute', top: '24px', right: '24px', background: 'rgba(255,255,255,0.1)', border: 'none', borderRadius: '50%', width: '40px', height: '40px', color: '#E1DDEC', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', transition: 'background 0.2s' }} onMouseEnter={e => e.currentTarget.style.background = 'rgba(255,255,255,0.2)'} onMouseLeave={e => e.currentTarget.style.background = 'rgba(255,255,255,0.1)'}>
            <i className="ti ti-x" style={{ fontSize: '18px' }} />
          </button>

          <div style={{ textAlign: 'center', marginBottom: '32px' }}>
            <p style={{ fontSize: '11px', color: '#B4A9C8', textTransform: 'uppercase', letterSpacing: '0.08em', marginBottom: '10px' }}>Hyperfokus-Blocker</p>
            <h2 style={{ fontSize: '32px', fontWeight: 400, color: '#F3EEFB', lineHeight: 1.3, marginBottom: '10px' }}>Zeit für einen System-Check.</h2>
            <p style={{ fontSize: '15px', color: '#B4A9C8', maxWidth: '600px', margin: '0 auto', lineHeight: 1.6 }}>
              Du arbeitest seit drei Stunden ohne Pause hochkonzentriert – großartig! Aber lass uns kurz prüfen, ob dein Körper auch noch versorgt ist.
            </p>
          </div>

          <div style={{ display: 'flex', gap: '32px', width: '100%', maxWidth: '960px', alignItems: 'stretch', maxHeight: '55vh' }}>
            {/* Left Column: Recommendations & Timer */}
            <div style={{ flex: 1.1, display: 'flex', flexDirection: 'column', gap: '20px' }}>
              <div style={{ display: 'flex', gap: '20px', alignItems: 'center', background: 'rgba(255,255,255,0.04)', padding: '20px 24px', borderRadius: 'var(--border-radius-lg)', border: '0.5px solid rgba(255,255,255,0.1)', flex: 1 }}>
                <div style={{ flexShrink: 0 }}>
                  <Companion size="sm" mood="focused" wave={false} animate={false} />
                </div>
                <div style={{ flex: 1 }}>
                  <p style={{ fontSize: '13px', fontWeight: 500, color: '#F3EEFB', marginBottom: '6px' }}>Dein Companion empfiehlt:</p>
                  <ul style={{ fontSize: '12px', color: '#B4A9C8', paddingLeft: '18px', display: 'flex', flexDirection: 'column', gap: '5px', lineHeight: 1.4 }}>
                    <li>Trinke einen Schluck Wasser 💧</li>
                    <li>Lass die Schultern einmal locker fallen 🧘</li>
                    <li>Richte den Blick für 20 Sekunden in die Ferne 👁️</li>
                  </ul>
                </div>
              </div>

              <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'rgba(127,119,221,0.05)', border: '0.5px solid rgba(127,119,221,0.3)', borderRadius: 'var(--border-radius-lg)', padding: '20px 28px', flex: 1 }}>
                <div style={{ display: 'flex', alignItems: 'center', gap: '20px' }}>
                  <div style={{ background: 'rgba(127,119,221,0.1)', border: '1px solid #7F77DD', borderRadius: 'var(--border-radius-md)', padding: '10px 24px', textAlign: 'center' }}>
                    <p style={{ fontSize: '32px', fontWeight: 400, color: '#EEEDFE', fontFamily: 'monospace', letterSpacing: '1px', lineHeight: 1 }}>{fmt(timer)}</p>
                    <p style={{ fontSize: '9px', color: '#AFA9EC', marginTop: '2px', textTransform: 'uppercase', letterSpacing: '0.05em' }}>Mikropause</p>
                  </div>
                  <div>
                    <p style={{ fontSize: '13px', fontWeight: 500, color: '#EEEDFE' }}>Pause läuft</p>
                    <p style={{ fontSize: '11px', color: '#B4A9C8' }}>Nimm dir diese zwei Minuten für dich.</p>
                  </div>
                </div>
                <button onClick={() => setActive(!active)} style={{ padding: '10px 18px', background: active ? '#D85A30' : '#7F77DD', border: 'none', borderRadius: 'var(--border-radius-md)', color: '#EEEDFE', fontSize: '12px', fontWeight: 500, cursor: 'pointer', display: 'flex', alignItems: 'center', gap: '6px', transition: 'background 0.2s' }}>
                  <i className={`ti ${active ? 'ti-player-pause' : 'ti-player-play'}`} style={{ fontSize: '12px' }} />
                  {active ? 'Pause halten' : 'Pause starten'}
                </button>
              </div>
            </div>

            {/* Right Column: Aufgaben des Tages */}
            <div style={{ flex: 0.9, background: 'rgba(255,255,255,0.03)', border: '0.5px solid rgba(255,255,255,0.08)', borderRadius: 'var(--border-radius-lg)', padding: '20px', display: 'flex', flexDirection: 'column', overflow: 'hidden' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: '8px', marginBottom: '14px', borderBottom: '0.5px solid rgba(255,255,255,0.1)', paddingBottom: '10px' }}>
                <i className="ti ti-calendar-event" style={{ fontSize: '16px', color: '#7F77DD' }} />
                <p style={{ fontSize: '12px', fontWeight: 500, color: '#F3EEFB', textTransform: 'uppercase', letterSpacing: '0.06em' }}>Aufgaben des Tages</p>
                <span style={{ fontSize: '10px', background: 'rgba(255,255,255,0.08)', color: '#B4A9C8', padding: '1px 6px', borderRadius: '10px', fontWeight: 500, marginLeft: 'auto' }}>
                  {todayTasks.length}
                </span>
